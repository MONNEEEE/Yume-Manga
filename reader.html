<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#fff1f7">

    <title>อ่านมังงะ | Yume Manga</title>

    <link rel="stylesheet" href="style.css">

    <style>

/* =================================
   FULL SYNOPSIS POPUP
================================= */

.detail-synopsis {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.detail-synopsis:active {
    opacity: 0.75;
}

.synopsis-modal {
    position: fixed;
    inset: 0;
    z-index: 9999;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 22px;
    box-sizing: border-box;

    background: rgba(25, 12, 22, 0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
}

.synopsis-modal.show {
    opacity: 1;
    visibility: visible;
}

.synopsis-modal-content {
    width: 100%;
    max-width: 480px;
    max-height: 75vh;
    overflow-y: auto;

    padding: 25px;
    box-sizing: border-box;

    border-radius: 22px;
    background: #fff5f9;
    color: #754b60;

    box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);

    transform: translateY(20px) scale(0.97);
    transition: transform 0.3s ease;
}

.synopsis-modal.show .synopsis-modal-content {
    transform: translateY(0) scale(1);
}

.synopsis-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;

    margin-bottom: 18px;
}

.synopsis-modal-header h2 {
    margin: 0;
    color: #d65c91;
    font-size: 19px;
}

.synopsis-modal-close {
    width: 35px;
    height: 35px;
    flex-shrink: 0;

    border: none;
    border-radius: 50%;

    background: #ffe0ed;
    color: #d65c91;

    font-size: 22px;
    cursor: pointer;
}

.synopsis-modal-text {
    margin: 0;

    color: #754b60;
    font-size: 15px;
    line-height: 1.9;

    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.synopsis-hint {
    display: block;
    margin-top: 7px;

    color: #ffc0d9;
    font-size: 11px;
}


/* =================================
   PAGE TRANSITION
================================= */

body {
    opacity: 0;
    transition: opacity 0.5s ease;
    margin: 0;
    background: #171317;
}

body.page-ready {
    opacity: 1;
}

body.page-leaving {
    opacity: 0;
}


/* =================================
   READER LAYOUT
================================= */

.reader-container {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    padding: 0 0 100px;
    box-sizing: border-box;
}


/* =================================
   BOTTOM READER BAR
================================= */

.reader-header {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;

    z-index: 1000;

    width: 100%;
    min-height: 82px;

    padding:
        10px 12px
        calc(10px + env(safe-area-inset-bottom, 0px));

    box-sizing: border-box;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        42px
        42px
        46px
        42px
        46px;

    align-items: center;
    gap: 9px;

    background: rgba(255, 239, 247, 0.88);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    border-top: 1px solid rgba(255,255,255,0.9);

    box-shadow:
        0 -5px 25px rgba(190, 105, 145, 0.16);

    transition:
        opacity 0.3s ease,
        transform 0.3s ease;
}


/* =================================
   MANGA INFO
================================= */

.reader-info {
    display: flex;
    align-items: center;
    gap: 10px;

    min-width: 0;

    color: #75405c;
    text-decoration: none;

    -webkit-tap-highlight-color: transparent;
}

.reader-cover {
    width: 43px;
    height: 56px;

    flex-shrink: 0;

    object-fit: cover;

    border-radius: 8px;

    background: #f5d9e7;

    box-shadow:
        0 2px 8px rgba(180, 90, 130, 0.16);
}

.reader-info-text {
    min-width: 0;
    overflow: hidden;
}

.reader-info-text h1 {
    margin: 0;

    font-size: 13px;
    font-weight: 700;
    color: #75405c;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.reader-info-text p {
    margin: 4px 0 0;

    font-size: 11px;
    color: #ad7892;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* =================================
   TOOL BUTTONS
================================= */

.reader-tool-button {
    width: 42px;
    height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;

    border: 1px solid rgba(204, 143, 174, 0.28);
    border-radius: 14px;

    background: rgba(255, 255, 255, 0.55);

    color: #d65c91;

    -webkit-tap-highlight-color: transparent;

    transition:
        background 0.2s ease,
        transform 0.2s ease;
}

.reader-tool-button svg {
    width: 23px;
    height: 23px;

    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.reader-tool-button:active {
    transform: scale(0.9);
    background: #ffe0ed;
}


/* =================================
   CHAPTER BUTTONS
================================= */

.reader-page-button {
    width: 46px;
    height: 46px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: none;
    border-radius: 50%;

    background: #e987b3;
    color: white;

    font-size: 32px;
    font-weight: 400;
    line-height: 1;

    text-decoration: none;

    box-shadow:
        0 3px 10px rgba(208, 105, 151, 0.22);

    -webkit-tap-highlight-color: transparent;

    transition:
        transform 0.2s ease,
        background 0.2s ease;
}

.reader-page-button:active {
    transform: scale(0.9);
    background: #d65c91;
}

.reader-page-button.disabled {
    opacity: 0.35;
    pointer-events: none;
}


/* =================================
   SETTINGS PANEL
================================= */

.reader-settings {
    position: fixed;

    right: 12px;
    bottom: calc(94px + env(safe-area-inset-bottom, 0px));

    z-index: 1002;

    width: 220px;
    padding: 16px;

    box-sizing: border-box;

    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 18px;

    background: rgba(255, 241, 247, 0.96);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 5px 25px rgba(170, 90, 130, 0.18);

    display: none;
}

.reader-settings.active {
    display: block;
}

.reader-settings h3 {
    margin: 0 0 12px;

    font-size: 14px;
    color: #a04470;
}

.reader-settings button {
    width: 100%;
    margin-top: 7px;
    padding: 10px;

    border: 1px solid #f0c4d8;
    border-radius: 10px;

    background: white;
    color: #a04470;

    font-size: 12px;
}

.reader-settings button:active {
    background: #ffe3ef;
}


/* =================================
   CHAPTER LIST PANEL
================================= */

.reader-chapter-panel {
    position: fixed;

    left: 12px;
    right: 12px;
    bottom: calc(94px + env(safe-area-inset-bottom, 0px));

    z-index: 1002;

    max-height: 55vh;
    overflow-y: auto;

    padding: 16px;

    box-sizing: border-box;

    border: 1px solid rgba(255,255,255,0.9);
    border-radius: 18px;

    background: rgba(255, 241, 247, 0.97);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 5px 25px rgba(170, 90, 130, 0.18);

    display: none;
}

.reader-chapter-panel.active {
    display: block;
}

.reader-chapter-panel h3 {
    margin: 0 0 12px;

    color: #a04470;
    font-size: 15px;
}

.chapter-list-item {
    display: block;

    width: 100%;
    padding: 11px 12px;
    margin-bottom: 7px;

    border: 1px solid #f0d1df;
    border-radius: 10px;

    background: rgba(255,255,255,0.8);

    color: #89516d;
    font-size: 13px;
    text-align: left;
    text-decoration: none;
}

.chapter-list-item.current {
    background: #f9d7e6;
    border-color: #e9a4c3;
    font-weight: 700;
}


/* =================================
   MANGA PAGES
================================= */

.reader-pages {
    width: 100%;
    min-height: 300px;
    background: #171317;

    transition: width 0.25s ease;
}

.reader-page {
    position: relative;
    width: 100%;
    overflow: hidden;
    line-height: 0;

    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

.reader-page img {
    display: block;

    width: 100%;
    height: auto;
    margin: 0 auto;

    -webkit-user-drag: none;
    -webkit-touch-callout: none;
    user-select: none;

    transition: filter 0.2s ease;
}

.reader-container.reader-narrow .reader-pages {
    width: 90%;
    margin: 0 auto;
}


/* =================================
   WATERMARK
================================= */

.reader-watermark {
    position: absolute;

    right: 15px;
    bottom: 18px;

    color: rgba(255,255,255,0.65);

    font-size: 13px;
    font-weight: bold;
    line-height: 1.5;

    text-shadow:
        0 1px 3px rgba(0,0,0,0.8),
        0 0 8px rgba(0,0,0,0.5);

    pointer-events: none;
    user-select: none;
}


/* =================================
   PLACEHOLDER
================================= */

.reader-placeholder {
    padding: 55px 20px;
    text-align: center;
    color: white;
    line-height: 1.8;
}

.reader-placeholder p {
    margin-top: 10px;
    color: #e7cbd8;
}


/* =================================
   ERROR
================================= */

.reader-error {
    text-align: center;
    padding: 70px 20px;
    color: white;
}


/* =================================
   HIDE / SHOW CONTROLS
================================= */

body.controls-hidden .reader-header {
    opacity: 0;
    transform: translateY(110%);
    pointer-events: none;
}

body.controls-hidden .reader-settings,
body.controls-hidden .reader-chapter-panel {
    display: none;
}


/* =================================
   DESKTOP READER
================================= */

@media (min-width: 701px) {

    /* READER WIDTH */

    .reader-container {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding-bottom: 130px;
    }

    .reader-pages {
        width: 100%;
        max-width: 1050px;
        margin: 0 auto;
    }

    .reader-page img {
        width: 100%;
        max-width: 1050px;
    }

    .reader-container.reader-narrow .reader-pages {
        width: 75%;
        max-width: 850px;
    }

    .reader-container.reader-narrow .reader-page img {
        max-width: 850px;
    }


    /* FLOATING BOTTOM BAR */

    .reader-header {
        left: 50%;
        right: auto;
        bottom: 20px;

        transform: translateX(-50%);

        width: min(1100px, 94%);
        min-height: 86px;

        padding: 12px 22px;

        grid-template-columns:
            minmax(0, 1fr)
            48px
            48px
            54px
            48px
            54px;

        gap: 13px;

        border: 1px solid rgba(255,255,255,0.9);
        border-radius: 22px;

        background: rgba(255, 239, 247, 0.94);

        box-shadow:
            0 8px 35px rgba(190, 105, 145, 0.2);
    }


    /* MANGA INFO */

    .reader-info {
        gap: 14px;
    }

    .reader-cover {
        width: 48px;
        height: 63px;
        border-radius: 10px;
    }

    .reader-info-text h1 {
        font-size: 15px;
    }

    .reader-info-text p {
        margin-top: 6px;
        font-size: 12px;
    }


    /* TOOL BUTTONS */

    .reader-tool-button {
        width: 48px;
        height: 48px;
        border-radius: 15px;
        cursor: pointer;
    }

    .reader-tool-button svg {
        width: 24px;
        height: 24px;
    }


    /* CHAPTER BUTTONS */

    .reader-page-button {
        width: 54px;
        height: 54px;
        font-size: 36px;
    }


    /* SETTINGS PANEL */

    .reader-settings {
        right: max(3%, calc((100vw - 1100px) / 2));
        bottom: 125px;

        width: 260px;
        padding: 20px;

        border-radius: 20px;
    }

    .reader-settings h3 {
        font-size: 16px;
        margin-bottom: 15px;
    }

    .reader-settings button {
        padding: 12px;
        font-size: 13px;
        cursor: pointer;
        transition:
            background 0.2s ease,
            transform 0.2s ease;
    }

    .reader-settings button:hover {
        background: #ffe3ef;
        transform: translateY(-2px);
    }


    /* CHAPTER LIST PANEL */

    .reader-chapter-panel {
        left: 50%;
        right: auto;
        bottom: 125px;

        transform: translateX(-50%);

        width: min(520px, 90%);
        max-height: 65vh;

        padding: 22px;
        border-radius: 22px;
    }

    .reader-chapter-panel h3 {
        font-size: 17px;
        margin-bottom: 16px;
    }

    .chapter-list-item {
        padding: 13px 16px;
        margin-bottom: 9px;

        border-radius: 12px;
        font-size: 14px;

        transition:
            background 0.2s ease,
            border-color 0.2s ease,
            transform 0.2s ease;
    }

    .chapter-list-item:hover {
        background: #ffe8f1;
        border-color: #e9a4c3;
        transform: translateX(4px);
    }


    /* WATERMARK */

    .reader-watermark {
        right: 20px;
        bottom: 22px;
        font-size: 14px;
    }


    /* HIDE CONTROLS */

    body.controls-hidden .reader-header {
        transform: translate(-50%, 130%);
    }


    /* DESKTOP HOVER */

    @media (hover: hover) {

        .reader-tool-button:hover {
            background: #ffe0ed;
            transform: translateY(-2px);
        }

        .reader-page-button:hover {
            background: #d65c91;
            transform: translateY(-2px);
        }

    }

}


/* =================================
   SMALL DESKTOP / LAPTOP
================================= */

@media (min-width: 701px) and (max-width: 1000px) {

    .reader-container {
        max-width: 900px;
    }

    .reader-pages {
        max-width: 900px;
    }

    .reader-page img {
        max-width: 900px;
    }

    .reader-header {
        width: 96%;
        padding: 10px 16px;
        gap: 9px;
    }

    .reader-info {
        gap: 9px;
    }

    .reader-info-text h1 {
        font-size: 13px;
    }

    .reader-info-text p {
        font-size: 11px;
    }

    .reader-container.reader-narrow .reader-pages {
        width: 82%;
    }

}


/* =================================
   MOBILE
================================= */

@media (max-width: 600px) {

    .reader-header {
        grid-template-columns:
            minmax(0, 1fr)
            36px
            36px
            40px
            36px
            40px;

        gap: 6px;

        padding:
            8px 8px
            calc(8px + env(safe-area-inset-bottom, 0px));

        min-height: 76px;
    }

    .reader-cover {
        width: 38px;
        height: 50px;
        border-radius: 7px;
    }

    .reader-info {
        gap: 7px;
    }

    .reader-info-text h1 {
        font-size: 11px;
    }

    .reader-info-text p {
        font-size: 10px;
    }

    .reader-tool-button {
        width: 36px;
        height: 36px;
        border-radius: 12px;
    }

    .reader-tool-button svg {
        width: 20px;
        height: 20px;
    }

    .reader-page-button {
        width: 40px;
        height: 40px;
        font-size: 29px;
    }

    .reader-container {
        padding-bottom: 90px;
    }

    .reader-watermark {
        right: 10px;
        bottom: 12px;
        font-size: 11px;
    }

    .reader-settings {
        right: 8px;
        bottom: calc(88px + env(safe-area-inset-bottom, 0px));
    }

    .reader-chapter-panel {
        left: 8px;
        right: 8px;
        bottom: calc(88px + env(safe-area-inset-bottom, 0px));
    }
}


/* =================================
   SMALL MOBILE
================================= */

@media (max-width: 370px) {

    .reader-header {
        grid-template-columns:
            minmax(0, 1fr)
            32px
            32px
            36px
            32px
            36px;

        gap: 4px;
        padding-left: 6px;
        padding-right: 6px;
    }

    .reader-cover {
        width: 33px;
        height: 45px;
    }

    .reader-info {
        gap: 5px;
    }

    .reader-info-text h1 {
        font-size: 10px;
    }

    .reader-info-text p {
        font-size: 9px;
    }

    .reader-tool-button {
        width: 32px;
        height: 32px;
    }

    .reader-page-button {
        width: 36px;
        height: 36px;
        font-size: 26px;
    }
}


/* =================================
   REDUCED MOTION
================================= */

@media (prefers-reduced-motion: reduce) {

    body,
    .reader-header,
    .reader-page-button,
    .reader-tool-button {
        transition: none !important;
    }
}

    </style>
</head>


<body>

    <main class="reader-container">

        <!-- READER HEADER -->

        <header class="reader-header">

            <!-- MANGA INFO -->

            <a href="#" class="reader-info" id="back-detail">

                <img
                    id="reader-cover"
                    class="reader-cover"
                    src=""
                    alt="ปกมังงะ"
                >

                <div class="reader-info-text">
                    <h1 id="manga-title">กำลังโหลด...</h1>
                    <p id="chapter-title"></p>
                </div>

            </a>


            <!-- BRIGHTNESS -->

            <button
                type="button"
                class="reader-tool-button"
                id="brightness-button"
                aria-label="ปรับความสว่าง"
            >
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2"/>
                    <path d="M12 20v2"/>
                    <path d="M4.93 4.93l1.42 1.42"/>
                    <path d="M17.65 17.65l1.42 1.42"/>
                    <path d="M2 12h2"/>
                    <path d="M20 12h2"/>
                    <path d="M4.93 19.07l1.42-1.42"/>
                    <path d="M17.65 6.35l1.42-1.42"/>
                </svg>
            </button>


            <!-- SETTINGS -->

            <button
                type="button"
                class="reader-tool-button"
                id="settings-button"
                aria-label="ตั้งค่า"
            >
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.7 2.94-.09-.02a1.7 1.7 0 0 0-1.75.75l-.05.08h-3.4l-.05-.08a1.7 1.7 0 0 0-1.75-.75l-.09.02-1.7-2.94.06-.06A1.7 1.7 0 0 0 9.6 15l-.09-.05v-3.4l.09-.05a1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.7-2.94.09.02a1.7 1.7 0 0 0 1.75-.75l.05-.08h3.4l.05.08a1.7 1.7 0 0 0 1.75.75l.09-.02 1.7 2.94-.06.06A1.7 1.7 0 0 0 19.4 11l.09.05v3.4z"/>
                </svg>
            </button>


            <!-- PREVIOUS CHAPTER -->

            <a
                href="#"
                id="previous-chapter"
                class="reader-page-button"
                aria-label="ตอนก่อนหน้า"
            >
                ‹
            </a>


            <!-- CHAPTER LIST -->

            <button
                type="button"
                class="reader-tool-button"
                id="chapter-list-button"
                aria-label="รายการตอน"
            >
                <svg viewBox="0 0 24 24">
                    <path d="M8 6h13"/>
                    <path d="M8 12h13"/>
                    <path d="M8 18h13"/>
                    <circle cx="3" cy="6" r="1"/>
                    <circle cx="3" cy="12" r="1"/>
                    <circle cx="3" cy="18" r="1"/>
                </svg>
            </button>


            <!-- NEXT CHAPTER -->

            <a
                href="#"
                id="next-chapter"
                class="reader-page-button"
                aria-label="ตอนถัดไป"
            >
                ›
            </a>

        </header>


        <!-- SETTINGS PANEL -->

        <div class="reader-settings" id="reader-settings">

            <h3>ตั้งค่าการอ่าน 🌸</h3>

            <button type="button" id="width-full">
                แสดงภาพเต็มความกว้าง
            </button>

            <button type="button" id="width-narrow">
                แสดงภาพแบบกึ่งกลาง
            </button>

        </div>


        <!-- CHAPTER LIST PANEL -->

        <div class="reader-chapter-panel" id="reader-chapter-panel">

            <h3>รายการตอนมังงะ</h3>

            <div id="chapter-list-content"></div>

        </div>


        <!-- MANGA PAGES -->

        <section class="reader-pages" id="reader-pages">
        </section>

    </main>


    <!-- LOAD DATA -->

    <script src="script.js"></script>


    <script>

/* =========================================
   YUME MANGA READER
   PINK DREAM - FIXED EDITION
   TH / JA / EN
========================================= */


/* =========================================
   GET MANGA DATA
========================================= */

const params = new URLSearchParams(window.location.search);

const mangaId = params.get("id");

const chapterIndex = Number(params.get("chapter") || 0);

const manga = window.mangaData?.find(
    item => String(item.id) === String(mangaId)
);


/* =========================================
   ELEMENTS
========================================= */

const readerContainer = document.querySelector(".reader-container");
const readerPages = document.getElementById("reader-pages");

const mangaTitle = document.getElementById("manga-title");
const chapterTitle = document.getElementById("chapter-title");
const readerCover = document.getElementById("reader-cover");

const previousButton = document.getElementById("previous-chapter");
const nextButton = document.getElementById("next-chapter");

const brightnessButton = document.getElementById("brightness-button");
const settingsButton = document.getElementById("settings-button");
const chapterListButton = document.getElementById("chapter-list-button");

const settingsPanel = document.getElementById("reader-settings");
const chapterPanel = document.getElementById("reader-chapter-panel");
const chapterListContent = document.getElementById("chapter-list-content");

const widthFullButton = document.getElementById("width-full");
const widthNarrowButton = document.getElementById("width-narrow");

const backDetail = document.getElementById("back-detail");


/* =========================================
   LANGUAGE
========================================= */

let currentLanguage = localStorage.getItem("yumeLanguage") || "th";

if (!["th", "ja", "en"].includes(currentLanguage)) {
    currentLanguage = "th";
}


/* =========================================
   TRANSLATIONS
========================================= */

const readerTranslations = {

    th: {
        brightness: "ปรับความสว่าง",
        settings: "ตั้งค่า",
        previous: "ตอนก่อนหน้า",
        next: "ตอนถัดไป",
        chapterList: "รายการตอน",
        readingSettings: "ตั้งค่าการอ่าน 🌸",
        fullWidth: "แสดงภาพเต็มความกว้าง",
        narrowWidth: "แสดงภาพแบบกึ่งกลาง",
        chapterPanel: "รายการตอนมังงะ",
        missing: "ไม่พบตอนที่ต้องการ 🌸",
        missingMessage: "ลองกลับไปยังหน้ารายละเอียดมังงะอีกครั้ง",
        home: "กลับหน้าแรก",
        noImages: "🌸 ยังไม่มีภาพมังงะในตอนนี้",
        noImagesMessage: "ยังไม่มีภาพในภาษาที่เลือก หรือภาพไม่สามารถโหลดได้",
        imageAlt: "หน้ามังงะ",
        watermark: "Yume Manga",
        imageError: "ไม่สามารถโหลดภาพหน้านี้ได้",
        chapterError: "ไม่พบตอนที่ต้องการ"
    },

    ja: {
        brightness: "明るさ",
        settings: "設定",
        previous: "前の話",
        next: "次の話",
        chapterList: "話一覧",
        readingSettings: "読書設定 🌸",
        fullWidth: "全幅表示",
        narrowWidth: "中央表示",
        chapterPanel: "話一覧",
        missing: "話が見つかりません 🌸",
        missingMessage: "作品詳細ページに戻ってください。",
        home: "ホームに戻る",
        noImages: "🌸 この話の画像はまだありません",
        noImagesMessage: "選択した言語の画像がないか、画像を読み込めませんでした。",
        imageAlt: "漫画ページ",
        watermark: "Yume Manga",
        imageError: "このページを読み込めませんでした",
        chapterError: "話が見つかりません"
    },

    en: {
        brightness: "Brightness",
        settings: "Settings",
        previous: "Previous Chapter",
        next: "Next Chapter",
        chapterList: "Chapter List",
        readingSettings: "Reading Settings 🌸",
        fullWidth: "Full Width",
        narrowWidth: "Centered Width",
        chapterPanel: "Manga Chapters",
        missing: "Chapter not found 🌸",
        missingMessage: "Please return to the manga details page.",
        home: "Back to Home",
        noImages: "🌸 No manga images available yet",
        noImagesMessage: "Images for this language are unavailable or could not be loaded.",
        imageAlt: "Manga page",
        watermark: "Yume Manga",
        imageError: "Unable to load this page",
        chapterError: "Chapter not found"
    }

};


/* =========================================
   CURRENT CHAPTER
========================================= */

const chapters = manga?.chapters || [];

const currentChapter = chapters[chapterIndex] || null;


/* =========================================
   TRANSLATION HELPERS
========================================= */

function getTranslation(key) {

    return readerTranslations[currentLanguage]?.[key]
        || readerTranslations.th[key]
        || key;

}


function getChapterName(index) {

    if (currentLanguage === "ja") {
        return `第${index + 1}話`;
    }

    if (currentLanguage === "en") {
        return `Chapter ${index + 1}`;
    }

    return `ตอนที่ ${index + 1}`;

}


function getLocalizedChapterTitle(chapter, index) {

    if (
        chapter?.title &&
        typeof chapter.title === "object"
    ) {

        return chapter.title[currentLanguage]
            || chapter.title.th
            || chapter.title.en
            || chapter.title.ja
            || getChapterName(index);

    }

    if (
        typeof chapter?.title === "string" &&
        chapter.title.trim() !== ""
    ) {

        const standardTitle =
            /^(ตอนที่\s*\d+|chapter\s*\d+|第\s*\d+\s*話)$/i;

        if (!standardTitle.test(chapter.title.trim())) {
            return chapter.title;
        }

    }

    return getChapterName(index);

}


function getLocalizedMangaTitle(item) {

    if (!item) return "";

    if (
        item.title &&
        typeof item.title === "object"
    ) {

        return item.title[currentLanguage]
            || item.title.th
            || item.title.en
            || item.title.ja
            || "";

    }

    return item.title || "";

}


function getLocalizedCover(item) {

    if (!item) return "";

    if (
        item.cover &&
        typeof item.cover === "object"
    ) {

        return item.cover[currentLanguage]
            || item.cover.th
            || item.cover.en
            || item.cover.ja
            || "";

    }

    return item.cover || "";

}


/* =========================================
   SAFE HTML
========================================= */

function escapeReaderHTML(value) {

    return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[character]);

}


/* =========================================
   PAGE TRANSITION
========================================= */

function navigateWithFade(url) {

    document.body.classList.remove("page-ready");
    document.body.classList.add("page-leaving");

    setTimeout(() => {
        window.location.href = url;
    }, 350);

}


/* =========================================
   GET PAGES BY LANGUAGE
========================================= */

function getPagesByLanguage(chapter) {

    const pageData = chapter?.pages;

    if (!pageData) {
        return [];
    }

    // รองรับ Array แบบเดิม

    if (Array.isArray(pageData)) {
        return pageData;
    }

    // รองรับ Object แยกภาษา

    if (typeof pageData === "object") {

        const languageOrder = [
            currentLanguage,
            "th",
            "en",
            "ja"
        ];

        for (const language of languageOrder) {

            const selectedPages = pageData[language];

            if (
                Array.isArray(selectedPages) &&
                selectedPages.length > 0
            ) {

                return selectedPages;

            }

        }

    }

    return [];

}


/* =========================================
   RENDER PAGES
========================================= */

function renderPages() {

    if (!readerPages || !currentChapter) {
        return;
    }

    const pages = getPagesByLanguage(currentChapter);

    const validPages = pages.filter(page => {

        return typeof page === "string"
            && /^https?:\/\//i.test(page);

    });


    if (!validPages.length) {

        readerPages.innerHTML = `

            <div class="reader-placeholder">

                <h2>${getTranslation("noImages")}</h2>

                <p>${getTranslation("noImagesMessage")}</p>

            </div>

        `;

        return;

    }


    readerPages.innerHTML = validPages.map(
        (page, index) => {

            const safeURL = escapeReaderHTML(page);

            return `

                <div class="reader-page">

                    <img
                        src="${safeURL}"
                        alt="${escapeReaderHTML(getTranslation("imageAlt"))} ${index + 1}"
                        loading="${index === 0 ? "eager" : "lazy"}"
                        decoding="async"
                        draggable="false"
                    >

                    <span class="reader-watermark">
                        ${escapeReaderHTML(getTranslation("watermark"))}
                    </span>

                </div>

            `;

        }
    ).join("");


    // ตรวจสอบภาพที่โหลดไม่สำเร็จ

    readerPages.querySelectorAll(".reader-page img")
    .forEach(img => {

        img.addEventListener("error", function () {

            if (this.dataset.failed === "true") {
                return;
            }

            this.dataset.failed = "true";

            const pageContainer = this.closest(".reader-page");

            if (!pageContainer) {
                return;
            }

            pageContainer.style.minHeight = "150px";
            pageContainer.style.display = "flex";
            pageContainer.style.alignItems = "center";
            pageContainer.style.justifyContent = "center";
            pageContainer.style.background = "#241b22";
            pageContainer.style.lineHeight = "1.6";

            this.style.display = "none";

            const errorMessage = document.createElement("p");

            errorMessage.textContent = getTranslation("imageError");

            errorMessage.style.color = "#f4c8dc";
            errorMessage.style.padding = "20px";
            errorMessage.style.textAlign = "center";

            pageContainer.appendChild(errorMessage);

        });

    });

}


/* =========================================
   RENDER CHAPTER LIST
========================================= */

function renderChapterList() {

    if (!chapterListContent || !chapters.length) {
        return;
    }

    chapterListContent.innerHTML = chapters.map(
        (chapter, index) => {

            const title = escapeReaderHTML(
                getLocalizedChapterTitle(chapter, index)
            );

            const isCurrent = index === chapterIndex;

            return `

                <a

                    class="chapter-list-item ${isCurrent ? "current" : ""}"

                    href="reader.html?id=${encodeURIComponent(manga.id)}&chapter=${index}"

                >

                    ${title}

                    ${isCurrent ? " ✓" : ""}

                </a>

            `;

        }
    ).join("");

}


/* =========================================
   UPDATE LANGUAGE UI
========================================= */

function updateReaderLanguage() {

    if (!manga || !currentChapter) {
        return;
    }

    document.documentElement.lang = currentLanguage;

    mangaTitle.textContent =
        getLocalizedMangaTitle(manga);

    chapterTitle.textContent =
        getLocalizedChapterTitle(
            currentChapter,
            chapterIndex
        );


    brightnessButton?.setAttribute(
        "aria-label",
        getTranslation("brightness")
    );

    settingsButton?.setAttribute(
        "aria-label",
        getTranslation("settings")
    );

    previousButton?.setAttribute(
        "aria-label",
        getTranslation("previous")
    );

    nextButton?.setAttribute(
        "aria-label",
        getTranslation("next")
    );

    chapterListButton?.setAttribute(
        "aria-label",
        getTranslation("chapterList")
    );


    const settingsHeading =
        settingsPanel?.querySelector("h3");

    if (settingsHeading) {

        settingsHeading.textContent =
            getTranslation("readingSettings");

    }


    if (widthFullButton) {

        widthFullButton.textContent =
            getTranslation("fullWidth");

    }


    if (widthNarrowButton) {

        widthNarrowButton.textContent =
            getTranslation("narrowWidth");

    }


    const chapterHeading =
        chapterPanel?.querySelector("h3");

    if (chapterHeading) {

        chapterHeading.textContent =
            getTranslation("chapterPanel");

    }


    renderPages();
    renderChapterList();

}


/* =========================================
   SAVE READING HISTORY
========================================= */

function saveReadingHistory() {

    if (!manga || !currentChapter) {
        return;
    }

    try {

        const history = JSON.parse(
            localStorage.getItem("yumeReadingHistory") || "{}"
        );

        history[String(manga.id)] = {

            chapter: chapterIndex,

            title: getLocalizedChapterTitle(
                currentChapter,
                chapterIndex
            ),

            updatedAt: Date.now()

        };

        localStorage.setItem(
            "yumeReadingHistory",
            JSON.stringify(history)
        );

    } catch (error) {

        console.warn(
            "Reading history could not be saved.",
            error
        );

    }

}


/* =========================================
   COVER
========================================= */

function renderCover() {

    if (!readerCover || !manga) {
        return;
    }

    const coverURL = getLocalizedCover(manga);

    if (
        typeof coverURL === "string" &&
        /^https?:\/\//i.test(coverURL)
    ) {

        readerCover.src = coverURL;
        readerCover.style.display = "";

        readerCover.onerror = function () {
            this.style.display = "none";
        };

    } else {

        readerCover.style.display = "none";

    }

}


/* =========================================
   CHAPTER BUTTONS
========================================= */

function setupChapterNavigation() {

    if (!manga || !chapters.length) {
        return;
    }


    // Previous

    if (chapterIndex > 0) {

        previousButton.href =
            `reader.html?id=${encodeURIComponent(manga.id)}&chapter=${chapterIndex - 1}`;

        previousButton.classList.remove("disabled");
        previousButton.removeAttribute("aria-disabled");

    } else {

        previousButton.href = "#";

        previousButton.classList.add("disabled");

        previousButton.setAttribute(
            "aria-disabled",
            "true"
        );

    }


    // Next

    if (chapterIndex < chapters.length - 1) {

        nextButton.href =
            `reader.html?id=${encodeURIComponent(manga.id)}&chapter=${chapterIndex + 1}`;

        nextButton.classList.remove("disabled");
        nextButton.removeAttribute("aria-disabled");

    } else {

        nextButton.href = "#";

        nextButton.classList.add("disabled");

        nextButton.setAttribute(
            "aria-disabled",
            "true"
        );

    }

}


/* =========================================
   CHAPTER BUTTON EVENTS
========================================= */

function setupChapterButton(button) {

    if (!button) {
        return;
    }

    button.addEventListener("click", event => {

        event.preventDefault();

        if (
            button.classList.contains("disabled") ||
            button.getAttribute("aria-disabled") === "true"
        ) {
            return;
        }

        if (button.href && button.href !== "#") {

            navigateWithFade(button.href);

        }

    });

}


/* =========================================
   BACK TO DETAIL
========================================= */

function setupBackDetail() {

    if (!backDetail || !manga) {
        return;
    }

    backDetail.href =
        `detail.html?id=${encodeURIComponent(manga.id)}`;

    backDetail.addEventListener("click", event => {

        event.preventDefault();

        navigateWithFade(backDetail.href);

    });

}


/* =========================================
   BRIGHTNESS
========================================= */

let brightnessLevel = 100;

const brightnessLevels = [100, 85, 70];

function applyBrightness() {

    document.querySelectorAll(".reader-page img")
    .forEach(img => {

        img.style.filter =
            `brightness(${brightnessLevel}%)`;

    });

}


brightnessButton?.addEventListener("click", () => {

    const currentIndex =
        brightnessLevels.indexOf(brightnessLevel);

    brightnessLevel =
        brightnessLevels[
            (currentIndex + 1) % brightnessLevels.length
        ];

    applyBrightness();

    brightnessButton.style.background =
        brightnessLevel === 100
        ? "rgba(255,255,255,0.55)"
        : "#f9d5e5";

});


/* =========================================
   SETTINGS PANEL
========================================= */

settingsButton?.addEventListener("click", () => {

    settingsPanel?.classList.toggle("active");

    chapterPanel?.classList.remove("active");

});


widthFullButton?.addEventListener("click", () => {

    readerContainer?.classList.remove("reader-narrow");

    settingsPanel?.classList.remove("active");

});


widthNarrowButton?.addEventListener("click", () => {

    readerContainer?.classList.add("reader-narrow");

    settingsPanel?.classList.remove("active");

});


/* =========================================
   CHAPTER LIST PANEL
========================================= */

chapterListButton?.addEventListener("click", () => {

    chapterPanel?.classList.toggle("active");

    settingsPanel?.classList.remove("active");

});


/* =========================================
   TAP TO HIDE CONTROLS
========================================= */

document.addEventListener("click", event => {

    const target = event.target;

    if (!(target instanceof Element)) {
        return;
    }

    if (
        target.closest(
            ".reader-header, .reader-settings, .reader-chapter-panel"
        )
    ) {
        return;
    }

    if (target.closest("a, button")) {
        return;
    }

    settingsPanel?.classList.remove("active");
    chapterPanel?.classList.remove("active");

    document.body.classList.toggle("controls-hidden");

});


/* =========================================
   IMAGE PROTECTION
========================================= */

document.addEventListener("contextmenu", event => {

    if (event.target instanceof Element &&
        event.target.closest(".reader-page")) {

        event.preventDefault();

    }

});


document.addEventListener("dragstart", event => {

    if (event.target instanceof Element &&
        event.target.closest(".reader-page")) {

        event.preventDefault();

    }

});


document.addEventListener("selectstart", event => {

    if (event.target instanceof Element &&
        event.target.closest(".reader-page")) {

        event.preventDefault();

    }

});


/* =========================================
   LANGUAGE CHANGE EVENT
========================================= */

window.addEventListener(
    "yume-language-change",
    event => {

        const newLanguage = event.detail?.language;

        if (!["th", "ja", "en"].includes(newLanguage)) {
            return;
        }

        currentLanguage = newLanguage;

        localStorage.setItem(
            "yumeLanguage",
            currentLanguage
        );

        updateReaderLanguage();

    }
);


/* =========================================
   INITIALIZATION
========================================= */

function initializeReader() {

    if (
        !manga ||
        !Array.isArray(manga.chapters) ||
        !Number.isInteger(chapterIndex) ||
        !currentChapter
    ) {

        if (readerContainer) {

            readerContainer.innerHTML = `

                <div class="reader-error">

                    <h2>${getTranslation("missing")}</h2>

                    <p>${getTranslation("missingMessage")}</p>

                    <br>

                    <a href="index.html">
                        ${getTranslation("home")}
                    </a>

                </div>

            `;

        }

        return;

    }


    renderCover();

    updateReaderLanguage();

    saveReadingHistory();

    setupChapterNavigation();

    setupChapterButton(previousButton);

    setupChapterButton(nextButton);

    setupBackDetail();

}


initializeReader();


/* =========================================
   PAGE READY
========================================= */

window.addEventListener("pageshow", () => {

    requestAnimationFrame(() => {

        document.body.classList.add("page-ready");

        document.body.classList.remove("page-leaving");

    });

});


console.log("🌸 Yume Manga Reader Loaded");

</script>
