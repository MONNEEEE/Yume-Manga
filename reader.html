
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#fff1f7">

    <title>อ่านมังงะ | Yume Manga</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            opacity: 0;
            transition: opacity .5s ease;
            margin: 0;
            background: #171317;
        }

        body.page-ready { opacity: 1; }
        body.page-leaving { opacity: 0; }

        .reader-container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            padding-top: calc(env(safe-area-inset-top, 0px) + 78px);
            padding-bottom: 30px;
            box-sizing: border-box;
        }

        /* TOP BAR */
        .reader-header {
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            left: 0;
            right: 0;
            z-index: 1000;
            min-height: 68px;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            padding: 10px 15px;
            background: rgba(255, 235, 244, .97);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 3px 15px rgba(0,0,0,.08);
            transition: opacity .3s ease, transform .3s ease;
        }

        .reader-header a {
            color: #d65c91;
            text-decoration: none;
            font-weight: bold;
            white-space: nowrap;
        }

        #back-detail { font-size: 15px; }
        .reader-home { font-size: 14px; }

        .reader-heading {
            min-width: 0;
            text-align: center;
            overflow: hidden;
        }

        .reader-heading h1 {
            margin: 0;
            font-size: 15px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #513342;
        }

        .reader-heading p {
            margin: 4px 0 0;
            font-size: 12px;
            color: #b75a83;
            white-space: nowrap;
        }

        /* PAGES */
        .reader-pages {
            width: 100%;
            min-height: 300px;
            background: #171317;
        }

        .reader-page {
            position: relative;
            width: 100%;
            overflow: hidden;
            line-height: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .reader-page img {
            display: block;
            width: 100%;
            height: auto;
            min-height: 100px;
            margin: 0 auto;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;
        }

        .reader-page.image-error {
            min-height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #292129;
            color: #f4cddd;
            line-height: 1.7;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .reader-page.image-error img {
            display: none;
        }

        .reader-error-message {
            display: none;
        }

        .reader-page.image-error .reader-error-message {
            display: block;
        }

        .reader-watermark {
            position: absolute;
            right: 15px;
            bottom: 18px;
            color: rgba(255,255,255,.65);
            font-size: 13px;
            font-weight: bold;
            line-height: 1.5;
            text-shadow: 0 1px 3px #000, 0 0 8px #000;
            pointer-events: none;
        }

        /* CHAPTER BUTTONS */
        .reader-navigation {
            position: fixed;
            left: 15px;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
            z-index: 1001;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: opacity .3s ease, transform .3s ease;
        }

        .reader-navigation a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,.96);
            color: #d65c91;
            font-size: 27px;
            text-decoration: none;
            box-shadow: 0 3px 14px rgba(0,0,0,.16);
            -webkit-tap-highlight-color: transparent;
        }

        .reader-navigation a.disabled {
            opacity: .35;
            pointer-events: none;
        }

        /* HIDE CONTROLS */
        body.controls-hidden .reader-header {
            opacity: 0;
            transform: translateY(-110%);
            pointer-events: none;
        }

        body.controls-hidden .reader-navigation {
            opacity: 0;
            transform: translateY(25px);
            pointer-events: none;
        }

        .reader-placeholder,
        .reader-error {
            padding: 55px 20px;
            text-align: center;
            color: #fff;
            line-height: 1.8;
        }

        .reader-placeholder p { color: #e7cbd8; }

        @media (max-width: 600px) {
            .reader-header {
                gap: 8px;
                padding: 10px 11px;
                min-height: 64px;
            }

            #back-detail { font-size: 13px; }
            .reader-home { font-size: 12px; }
            .reader-heading h1 { font-size: 13px; }
            .reader-heading p { font-size: 11px; }

            .reader-container {
                padding-top: calc(env(safe-area-inset-top, 0px) + 74px);
            }

            .reader-navigation {
                left: 13px;
                bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
                gap: 10px;
            }

            .reader-navigation a {
                width: 48px;
                height: 48px;
                font-size: 25px;
            }

            .reader-watermark {
                right: 10px;
                bottom: 12px;
                font-size: 11px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body, .reader-header, .reader-navigation {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="reader-container">

        <header class="reader-header">
            <a href="#" id="back-detail">← กลับ</a>

            <div class="reader-heading">
                <h1 id="manga-title">กำลังโหลด...</h1>
                <p id="chapter-title"></p>
            </div>

            <a href="index.html" class="reader-home">🌸 Yume Manga</a>
        </header>

        <section class="reader-pages" id="reader-pages"></section>

        <nav class="reader-navigation">
            <a href="#" id="previous-chapter" aria-label="ตอนก่อนหน้า">←</a>
            <a href="#" id="next-chapter" aria-label="ตอนถัดไป">→</a>
        </nav>
    </main>

    <script src="script.js"></script>

    <script>
        const params = new URLSearchParams(location.search);
        const mangaId = params.get("id");
        const chapterIndex = Number(params.get("chapter") || 0);

        const readerPages = document.getElementById("reader-pages");
        const mangaTitle = document.getElementById("manga-title");
        const chapterTitle = document.getElementById("chapter-title");
        const previousButton = document.getElementById("previous-chapter");
        const nextButton = document.getElementById("next-chapter");
        const backDetail = document.getElementById("back-detail");

        function navigateWithFade(url) {
            document.body.classList.remove("page-ready");
            document.body.classList.add("page-leaving");

            setTimeout(() => {
                location.href = url;
            }, 500);
        }

        // TAP TO HIDE / SHOW
        document.addEventListener("click", event => {
            if (event.target.closest("a, button, .reader-header")) return;
            document.body.classList.toggle("controls-hidden");
        });

        // FIND MANGA
        const manga = window.mangaData?.find(
            item => String(item.id) === String(mangaId)
        );

        if (
            !manga ||
            !Array.isArray(manga.chapters) ||
            !Number.isInteger(chapterIndex) ||
            !manga.chapters[chapterIndex]
        ) {
            readerPages.innerHTML = `
                <div class="reader-error">
                    <h2>ไม่พบตอนที่ต้องการ 🌸</h2>
                    <p>ตรวจสอบลิงก์หรือลองกลับไปหน้ารายละเอียดมังงะ</p>
                    <a href="index.html">กลับหน้าแรก</a>
                </div>
            `;
        } else {
            const chapters = manga.chapters;
            const currentChapter = chapters[chapterIndex];

            mangaTitle.textContent = manga.title;
            chapterTitle.textContent =
                currentChapter.title || `ตอนที่ ${chapterIndex + 1}`;

            // SAVE HISTORY
            try {
                const history = JSON.parse(
                    localStorage.getItem("yumeReadingHistory") || "{}"
                );

                history[String(manga.id)] = {
                    chapter: chapterIndex,
                    title: currentChapter.title || `ตอนที่ ${chapterIndex + 1}`,
                    updatedAt: Date.now()
                };

                localStorage.setItem(
                    "yumeReadingHistory",
                    JSON.stringify(history)
                );
            } catch (error) {
                console.warn("บันทึกประวัติไม่ได้", error);
            }

            // LOAD PAGES
            const pages = Array.isArray(currentChapter.pages)
                ? currentChapter.pages
                : [];

            const validPages = pages.filter(page =>
                typeof page === "string" &&
                /^https?:\/\//i.test(page.trim())
            );

            if (validPages.length) {
                readerPages.innerHTML = validPages.map((page, index) => `
                    <div class="reader-page">
                        <img
                            src="${page}"
                            alt="หน้ามังงะ ${index + 1}"
                            loading="${index < 2 ? "eager" : "lazy"}"
                            decoding="async"
                            referrerpolicy="no-referrer"
                            draggable="false"
                        >
                        <div class="reader-error-message">
                            <strong>โหลดรูปหน้านี้ไม่สำเร็จ</strong><br>
                            <span>ลองรีเฟรชหน้าเว็บอีกครั้ง</span>
                        </div>
                        <span class="reader-watermark"></span>
                    </div>
                `).join("");

                // CHECK IMAGE LOAD
                readerPages.querySelectorAll("img").forEach((img, index) => {
                    img.addEventListener("error", () => {
                        img.parentElement.classList.add("image-error");
                        console.error(
                            "โหลดรูปไม่สำเร็จ หน้าที่:",
                            index + 1,
                            img.src
                        );
                    });

                    img.addEventListener("load", () => {
                        img.parentElement.classList.remove("image-error");
                    });
                });
            } else {
                readerPages.innerHTML = `
                    <div class="reader-placeholder">
                        <h2>🌸 ยังไม่มีภาพมังงะในตอนนี้</h2>
                        <p>ยังไม่ได้เพิ่ม URL รูปภาพของตอนนี้</p>
                    </div>
                `;
            }

            // PREVIOUS CHAPTER
            if (chapterIndex > 0) {
                previousButton.href =
                    `reader.html?id=${encodeURIComponent(manga.id)}&chapter=${chapterIndex - 1}`;
            } else {
                previousButton.classList.add("disabled");
                previousButton.setAttribute("aria-disabled", "true");
            }

            // NEXT CHAPTER
            if (chapterIndex < chapters.length - 1) {
                nextButton.href =
                    `reader.html?id=${encodeURIComponent(manga.id)}&chapter=${chapterIndex + 1}`;
            } else {
                nextButton.classList.add("disabled");
                nextButton.setAttribute("aria-disabled", "true");
            }

            previousButton.addEventListener("click", event => {
                if (chapterIndex <= 0) {
                    event.preventDefault();
                    return;
                }
                event.preventDefault();
                navigateWithFade(previousButton.href);
            });

            nextButton.addEventListener("click", event => {
                if (chapterIndex >= chapters.length - 1) {
                    event.preventDefault();
                    return;
                }
                event.preventDefault();
                navigateWithFade(nextButton.href);
            });

            backDetail.href =
                `detail.html?id=${encodeURIComponent(manga.id)}`;

            backDetail.addEventListener("click", event => {
                event.preventDefault();
                navigateWithFade(backDetail.href);
            });
        }

        // IMAGE PROTECTION
        document.addEventListener("contextmenu", event => {
            if (event.target.closest(".reader-page")) event.preventDefault();
        });

        document.addEventListener("dragstart", event => {
            if (event.target.closest(".reader-page")) event.preventDefault();
        });

        document.addEventListener("selectstart", event => {
            if (event.target.closest(".reader-page")) event.preventDefault();
        });

        // PAGE READY
        window.addEventListener("pageshow", () => {
            requestAnimationFrame(() => {
                document.body.classList.add("page-ready");
                document.body.classList.remove("page-leaving");
            });
        });
    </script>
</body>
</html>
