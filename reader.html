<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#fff1f7">

    <title>อ่านมังงะ | Yume Manga</title>

    <link rel="stylesheet" href="style.css">

    <style>

/* =================================
   FULL SYNOPSIS POPUP
================================= */

.detail-synopsis {
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.detail-synopsis:active {
    opacity: 0.75;
}

.synopsis-modal {
    position: fixed;
    inset: 0;
    z-index: 9999;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 22px;
    box-sizing: border-box;

    background: rgba(25, 12, 22, 0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
}

.synopsis-modal.show {
    opacity: 1;
    visibility: visible;
}

.synopsis-modal-content {
    width: 100%;
    max-width: 480px;
    max-height: 75vh;
    overflow-y: auto;

    padding: 25px;
    box-sizing: border-box;

    border-radius: 22px;
    background: #fff5f9;
    color: #754b60;

    box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);

    transform: translateY(20px) scale(0.97);
    transition: transform 0.3s ease;
}

.synopsis-modal.show .synopsis-modal-content {
    transform: translateY(0) scale(1);
}

.synopsis-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;

    margin-bottom: 18px;
}

.synopsis-modal-header h2 {
    margin: 0;
    color: #d65c91;
    font-size: 19px;
}

.synopsis-modal-close {
    width: 35px;
    height: 35px;
    flex-shrink: 0;

    border: none;
    border-radius: 50%;

    background: #ffe0ed;
    color: #d65c91;

    font-size: 22px;
    cursor: pointer;
}

.synopsis-modal-text {
    margin: 0;

    color: #754b60;
    font-size: 15px;
    line-height: 1.9;

    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.synopsis-hint {
    display: block;
    margin-top: 7px;

    color: #ffc0d9;
    font-size: 11px;
}

        /* =================================
           PAGE TRANSITION
        ================================= */

        body {
            opacity: 0;
            transition: opacity 0.5s ease;
            margin: 0;
            background: #171317;
        }

        body.page-ready {
            opacity: 1;
        }

        body.page-leaving {
            opacity: 0;
        }


        /* =================================
           READER LAYOUT
        ================================= */

        .reader-container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            padding: 0 0 100px;
            box-sizing: border-box;
        }


        /* =================================
           BOTTOM READER BAR
        ================================= */

        .reader-header {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;

            z-index: 1000;

            width: 100%;
            min-height: 82px;

            padding:
                10px 12px
                calc(10px + env(safe-area-inset-bottom, 0px));

            box-sizing: border-box;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                42px
                42px
                46px
                42px
                46px;

            align-items: center;
            gap: 9px;

            background: rgba(255, 239, 247, 0.88);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            border-top: 1px solid rgba(255,255,255,0.9);

            box-shadow:
                0 -5px 25px rgba(190, 105, 145, 0.16);

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }


        /* =================================
           MANGA INFO
        ================================= */

        .reader-info {
            display: flex;
            align-items: center;
            gap: 10px;

            min-width: 0;

            color: #75405c;
            text-decoration: none;

            -webkit-tap-highlight-color: transparent;
        }

        .reader-cover {
            width: 43px;
            height: 56px;

            flex-shrink: 0;

            object-fit: cover;

            border-radius: 8px;

            background: #f5d9e7;

            box-shadow:
                0 2px 8px rgba(180, 90, 130, 0.16);
        }

        .reader-info-text {
            min-width: 0;
            overflow: hidden;
        }

        .reader-info-text h1 {
            margin: 0;

            font-size: 13px;
            font-weight: 700;
            color: #75405c;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .reader-info-text p {
            margin: 4px 0 0;

            font-size: 11px;
            color: #ad7892;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        /* =================================
           TOOL BUTTONS
        ================================= */

        .reader-tool-button {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            border: 1px solid rgba(204, 143, 174, 0.28);
            border-radius: 14px;

            background: rgba(255, 255, 255, 0.55);

            color: #d65c91;

            -webkit-tap-highlight-color: transparent;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .reader-tool-button svg {
            width: 23px;
            height: 23px;

            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .reader-tool-button:active {
            transform: scale(0.9);
            background: #ffe0ed;
        }


        /* =================================
           CHAPTER BUTTONS
        ================================= */

        .reader-page-button {
            width: 46px;
            height: 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;
            border-radius: 50%;

            background: #e987b3;
            color: white;

            font-size: 32px;
            font-weight: 400;
            line-height: 1;

            text-decoration: none;

            box-shadow:
                0 3px 10px rgba(208, 105, 151, 0.22);

            -webkit-tap-highlight-color: transparent;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .reader-page-button:active {
            transform: scale(0.9);
            background: #d65c91;
        }

        .reader-page-button.disabled {
            opacity: 0.35;
            pointer-events: none;
        }


        /* =================================
           SETTINGS PANEL
        ================================= */

        .reader-settings {
            position: fixed;

            right: 12px;
            bottom: calc(94px + env(safe-area-inset-bottom, 0px));

            z-index: 1002;

            width: 220px;
            padding: 16px;

            box-sizing: border-box;

            border: 1px solid rgba(255,255,255,0.9);
            border-radius: 18px;

            background: rgba(255, 241, 247, 0.96);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 5px 25px rgba(170, 90, 130, 0.18);

            display: none;
        }

        .reader-settings.active {
            display: block;
        }

        .reader-settings h3 {
            margin: 0 0 12px;

            font-size: 14px;
            color: #a04470;
        }

        .reader-settings button {
            width: 100%;
            margin-top: 7px;
            padding: 10px;

            border: 1px solid #f0c4d8;
            border-radius: 10px;

            background: white;
            color: #a04470;

            font-size: 12px;
        }

        .reader-settings button:active {
            background: #ffe3ef;
        }


        /* =================================
           CHAPTER LIST PANEL
        ================================= */

        .reader-chapter-panel {
            position: fixed;

            left: 12px;
            right: 12px;
            bottom: calc(94px + env(safe-area-inset-bottom, 0px));

            z-index: 1002;

            max-height: 55vh;
            overflow-y: auto;

            padding: 16px;

            box-sizing: border-box;

            border: 1px solid rgba(255,255,255,0.9);
            border-radius: 18px;

            background: rgba(255, 241, 247, 0.97);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 5px 25px rgba(170, 90, 130, 0.18);

            display: none;
        }

        .reader-chapter-panel.active {
            display: block;
        }

        .reader-chapter-panel h3 {
            margin: 0 0 12px;

            color: #a04470;
            font-size: 15px;
        }

        .chapter-list-item {
            display: block;

            width: 100%;
            padding: 11px 12px;
            margin-bottom: 7px;

            border: 1px solid #f0d1df;
            border-radius: 10px;

            background: rgba(255,255,255,0.8);

            color: #89516d;
            font-size: 13px;
            text-align: left;
            text-decoration: none;
        }

        .chapter-list-item.current {
            background: #f9d7e6;
            border-color: #e9a4c3;
            font-weight: 700;
        }


        /* =================================
           MANGA PAGES
        ================================= */

        .reader-pages {
            width: 100%;
            min-height: 300px;
            background: #171317;

            transition: width 0.25s ease;
        }

        .reader-page {
            position: relative;
            width: 100%;
            overflow: hidden;
            line-height: 0;

            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .reader-page img {
            display: block;

            width: 100%;
            height: auto;
            margin: 0 auto;

            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;

            transition: filter 0.2s ease;
        }

        .reader-container.reader-narrow .reader-pages {
            width: 90%;
            margin: 0 auto;
        }


        /* =================================
           WATERMARK
        ================================= */

        .reader-watermark {
            position: absolute;

            right: 15px;
            bottom: 18px;

            color: rgba(255,255,255,0.65);

            font-size: 13px;
            font-weight: bold;
            line-height: 1.5;

            text-shadow:
                0 1px 3px rgba(0,0,0,0.8),
                0 0 8px rgba(0,0,0,0.5);

            pointer-events: none;
            user-select: none;
        }


        /* =================================
           PLACEHOLDER
        ================================= */

        .reader-placeholder {
            padding: 55px 20px;
            text-align: center;
            color: white;
            line-height: 1.8;
        }

        .reader-placeholder p {
            margin-top: 10px;
            color: #e7cbd8;
        }


        /* =================================
           ERROR
        ================================= */

        .reader-error {
            text-align: center;
            padding: 70px 20px;
            color: white;
        }


        /* =================================
           HIDE / SHOW CONTROLS
        ================================= */

        body.controls-hidden .reader-header {
            opacity: 0;
            transform: translateY(110%);
            pointer-events: none;
        }

        body.controls-hidden .reader-settings,
        body.controls-hidden .reader-chapter-panel {
            display: none;
        }


        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            .reader-header {
                grid-template-columns:
                    minmax(0, 1fr)
                    36px
                    36px
                    40px
                    36px
                    40px;

                gap: 6px;

                padding:
                    8px 8px
                    calc(8px + env(safe-area-inset-bottom, 0px));

                min-height: 76px;
            }

            .reader-cover {
                width: 38px;
                height: 50px;
                border-radius: 7px;
            }

            .reader-info {
                gap: 7px;
            }

            .reader-info-text h1 {
                font-size: 11px;
            }

            .reader-info-text p {
                font-size: 10px;
            }

            .reader-tool-button {
                width: 36px;
                height: 36px;
                border-radius: 12px;
            }

            .reader-tool-button svg {
                width: 20px;
                height: 20px;
            }

            .reader-page-button {
                width: 40px;
                height: 40px;
                font-size: 29px;
            }

            .reader-container {
                padding-bottom: 90px;
            }

            .reader-watermark {
                right: 10px;
                bottom: 12px;
                font-size: 11px;
            }

            .reader-settings {
                right: 8px;
                bottom: calc(88px + env(safe-area-inset-bottom, 0px));
            }

            .reader-chapter-panel {
                left: 8px;
                right: 8px;
                bottom: calc(88px + env(safe-area-inset-bottom, 0px));
            }
        }


        /* =================================
           SMALL MOBILE
        ================================= */

        @media (max-width: 370px) {

            .reader-header {
                grid-template-columns:
                    minmax(0, 1fr)
                    32px
                    32px
                    36px
                    32px
                    36px;

                gap: 4px;
                padding-left: 6px;
                padding-right: 6px;
            }

            .reader-cover {
                width: 33px;
                height: 45px;
            }

            .reader-info {
                gap: 5px;
            }

            .reader-info-text h1 {
                font-size: 10px;
            }

            .reader-info-text p {
                font-size: 9px;
            }

            .reader-tool-button {
                width: 32px;
                height: 32px;
            }

            .reader-page-button {
                width: 36px;
                height: 36px;
                font-size: 26px;
            }
        }


        /* =================================
           REDUCED MOTION
        ================================= */

        @media (prefers-reduced-motion: reduce) {

            body,
            .reader-header,
            .reader-page-button,
            .reader-tool-button {
                transition: none !important;
            }
        }

    </style>
</head>


<body>

    <main class="reader-container">

        <!-- READER HEADER -->

        <header class="reader-header">

            <!-- MANGA INFO -->

            <a href="#" class="reader-info" id="back-detail">

                <img
                    id="reader-cover"
                    class="reader-cover"
                    src=""
                    alt="ปกมังงะ"
                >

                <div class="reader-info-text">
                    <h1 id="manga-title">กำลังโหลด...</h1>
                    <p id="chapter-title"></p>
                </div>

            </a>


            <!-- BRIGHTNESS -->

            <button
                type="button"
                class="reader-tool-button"
                id="brightness-button"
                aria-label="ปรับความสว่าง"
            >
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2"/>
                    <path d="M12 20v2"/>
                    <path d="M4.93 4.93l1.42 1.42"/>
                    <path d="M17.65 17.65l1.42 1.42"/>
                    <path d="M2 12h2"/>
                    <path d="M20 12h2"/>
                    <path d="M4.93 19.07l1.42-1.42"/>
                    <path d="M17.65 6.35l1.42-1.42"/>
                </svg>
            </button>


            <!-- SETTINGS -->

            <button
                type="button"
                class="reader-tool-button"
                id="settings-button"
                aria-label="ตั้งค่า"
            >
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.7 2.94-.09-.02a1.7 1.7 0 0 0-1.75.75l-.05.08h-3.4l-.05-.08a1.7 1.7 0 0 0-1.75-.75l-.09.02-1.7-2.94.06-.06A1.7 1.7 0 0 0 9.6 15l-.09-.05v-3.4l.09-.05a1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.7-2.94.09.02a1.7 1.7 0 0 0 1.75-.75l.05-.08h3.4l.05.08a1.7 1.7 0 0 0 1.75.75l.09-.02 1.7 2.94-.06.06A1.7 1.7 0 0 0 19.4 11l.09.05v3.4z"/>
                </svg>
            </button>


            <!-- PREVIOUS CHAPTER -->

            <a
                href="#"
                id="previous-chapter"
                class="reader-page-button"
                aria-label="ตอนก่อนหน้า"
            >
                ‹
            </a>


            <!-- CHAPTER LIST -->

            <button
                type="button"
                class="reader-tool-button"
                id="chapter-list-button"
                aria-label="รายการตอน"
            >
                <svg viewBox="0 0 24 24">
                    <path d="M8 6h13"/>
                    <path d="M8 12h13"/>
                    <path d="M8 18h13"/>
                    <circle cx="3" cy="6" r="1"/>
                    <circle cx="3" cy="12" r="1"/>
                    <circle cx="3" cy="18" r="1"/>
                </svg>
            </button>


            <!-- NEXT CHAPTER -->

            <a
                href="#"
                id="next-chapter"
                class="reader-page-button"
                aria-label="ตอนถัดไป"
            >
                ›
            </a>

        </header>


        <!-- SETTINGS PANEL -->

        <div class="reader-settings" id="reader-settings">

            <h3>ตั้งค่าการอ่าน 🌸</h3>

            <button type="button" id="width-full">
                แสดงภาพเต็มความกว้าง
            </button>

            <button type="button" id="width-narrow">
                แสดงภาพแบบกึ่งกลาง
            </button>

        </div>


        <!-- CHAPTER LIST PANEL -->

        <div class="reader-chapter-panel" id="reader-chapter-panel">

            <h3>รายการตอนมังงะ</h3>

            <div id="chapter-list-content"></div>

        </div>


        <!-- MANGA PAGES -->

        <section class="reader-pages" id="reader-pages">
        </section>

    </main>


    <!-- LOAD DATA -->

    <script src="script.js"></script>


    <script>

        /* =================================
           GET MANGA DATA
        ================================= */

        const params = new URLSearchParams(
            window.location.search
        );

        const mangaId = params.get("id");

        const chapterIndex = Number(
            params.get("chapter") || 0
        );

        const manga = window.mangaData?.find(
            item => String(item.id) === String(mangaId)
        );


        /* =================================
           ELEMENTS
        ================================= */

        const readerContainer =
            document.querySelector(".reader-container");

        const readerPages =
            document.getElementById("reader-pages");

        const mangaTitle =
            document.getElementById("manga-title");

        const chapterTitle =
            document.getElementById("chapter-title");

        const readerCover =
            document.getElementById("reader-cover");

        const previousButton =
            document.getElementById("previous-chapter");

        const nextButton =
            document.getElementById("next-chapter");

        const brightnessButton =
            document.getElementById("brightness-button");

        const settingsButton =
            document.getElementById("settings-button");

        const chapterListButton =
            document.getElementById("chapter-list-button");

        const settingsPanel =
            document.getElementById("reader-settings");

        const chapterPanel =
            document.getElementById("reader-chapter-panel");

        const chapterListContent =
            document.getElementById("chapter-list-content");


        /* =================================
           PAGE TRANSITION
        ================================= */

        function navigateWithFade(url) {

            document.body.classList.remove(
                "page-ready"
            );

            document.body.classList.add(
                "page-leaving"
            );

            setTimeout(() => {
                window.location.href = url;
            }, 500);

        }


        /* =================================
           CHECK DATA
        ================================= */

        if (
            !manga ||
            !Array.isArray(manga.chapters) ||
            !Number.isInteger(chapterIndex) ||
            !manga.chapters[chapterIndex]
        ) {

            readerContainer.innerHTML = `

                <div class="reader-error">

                    <h2>ไม่พบตอนที่ต้องการ 🌸</h2>

                    <p>
                        ลองกลับไปยังหน้ารายละเอียดมังงะอีกครั้ง
                    </p>

                    <br>

                    <a href="index.html">
                        กลับหน้าแรก
                    </a>

                </div>

            `;

        } else {

            /* CURRENT CHAPTER */

            const chapters = manga.chapters;

            const currentChapter =
                chapters[chapterIndex];


            /* =================================
               SAVE READING HISTORY
            ================================= */

            try {

                const history = JSON.parse(
                    localStorage.getItem(
                        "yumeReadingHistory"
                    ) || "{}"
                );

                history[String(manga.id)] = {

                    chapter: chapterIndex,

                    title: currentChapter.title ||
                        `ตอนที่ ${chapterIndex + 1}`,

                    updatedAt: Date.now()

                };

                localStorage.setItem(
                    "yumeReadingHistory",
                    JSON.stringify(history)
                );

            } catch (error) {

                console.warn(
                    "ไม่สามารถบันทึกประวัติการอ่านได้",
                    error
                );

            }


            /* =================================
               SHOW MANGA INFO
            ================================= */

            mangaTitle.textContent = manga.title;

            chapterTitle.textContent =
                currentChapter.title ||
                `ตอนที่ ${chapterIndex + 1}`;

            /* โหลดรูปปกจากข้อมูล manga.cover */

            if (
                typeof manga.cover === "string" &&
                /^https?:\/\//i.test(manga.cover)
            ) {

                readerCover.src = manga.cover;

                readerCover.onerror = () => {
                    readerCover.style.display = "none";
                };

            } else {

                readerCover.style.display = "none";

            }


            /* =================================
               LOAD MANGA PAGES
            ================================= */

            const pages = Array.isArray(
                currentChapter.pages
            )
                ? currentChapter.pages
                : [];

            const validPages = pages.filter(page =>

                typeof page === "string" &&
                /^https?:\/\//i.test(page)

            );


            if (validPages.length > 0) {

                readerPages.innerHTML =

                    validPages.map((page, index) => `

                        <div class="reader-page">

                            <img
                                src="${page}"
                                alt="หน้ามังงะ ${index + 1}"

                                loading="${
                                    index === 0
                                    ? "eager"
                                    : "lazy"
                                }"

                                draggable="false"
                                decoding="async"
                            >

                            <span class="reader-watermark"></span>

                        </div>

                    `).join("");


            } else {

                readerPages.innerHTML = `

                    <div class="reader-placeholder">

                        <h2>
                            🌸 ยังไม่มีภาพมังงะในตอนนี้
                        </h2>

                        <p>
                            ตอนนี้มีรายชื่อตอนแล้ว
                            แต่ยังไม่ได้เพิ่ม URL รูปภาพของแต่ละหน้า
                        </p>

                    </div>

                `;

            }


            /* =================================
               PREVIOUS CHAPTER
            ================================= */

            if (chapterIndex > 0) {

                previousButton.href =
                    `reader.html?id=${
                        encodeURIComponent(manga.id)
                    }&chapter=${chapterIndex - 1}`;

            } else {

                previousButton.classList.add("disabled");

                previousButton.setAttribute(
                    "aria-disabled",
                    "true"
                );

            }


            /* =================================
               NEXT CHAPTER
            ================================= */

            if (chapterIndex < chapters.length - 1) {

                nextButton.href =
                    `reader.html?id=${
                        encodeURIComponent(manga.id)
                    }&chapter=${chapterIndex + 1}`;

            } else {

                nextButton.classList.add("disabled");

                nextButton.setAttribute(
                    "aria-disabled",
                    "true"
                );

            }


            /* =================================
               CHAPTER LIST
            ================================= */

            chapterListContent.innerHTML =

                chapters.map((chapter, index) => `

                    <a
                        class="chapter-list-item ${
                            index === chapterIndex
                            ? "current"
                            : ""
                        }"

                        href="reader.html?id=${
                            encodeURIComponent(manga.id)
                        }&chapter=${index}"
                    >
                        ${
                            chapter.title ||
                            `ตอนที่ ${index + 1}`
                        }

                        ${
                            index === chapterIndex
                            ? " ✓"
                            : ""
                        }

                    </a>

                `).join("");


            /* =================================
               CHAPTER NAVIGATION EVENTS
            ================================= */

            function setupChapterButton(button, isNext) {

                button.addEventListener("click", event => {

                    event.preventDefault();

                    if (button.classList.contains("disabled")) {
                        return;
                    }

                    navigateWithFade(button.href);

                });

            }

            setupChapterButton(previousButton, false);
            setupChapterButton(nextButton, true);


            /* =================================
               BACK TO DETAIL
            ================================= */

            const backDetail =
                document.getElementById("back-detail");

            backDetail.href =
                `detail.html?id=${
                    encodeURIComponent(manga.id)
                }`;

            backDetail.addEventListener(
                "click",
                event => {

                    event.preventDefault();

                    navigateWithFade(
                        backDetail.href
                    );

                }
            );

        }


        /* =================================
           BRIGHTNESS CONTROL
        ================================= */

        let brightnessLevel = 100;

        const brightnessLevels = [100, 85, 70];

        brightnessButton.addEventListener("click", () => {

            const currentIndex =
                brightnessLevels.indexOf(brightnessLevel);

            brightnessLevel =
                brightnessLevels[
                    (currentIndex + 1) % brightnessLevels.length
                ];

            document.querySelectorAll(
                ".reader-page img"
            ).forEach(img => {

                img.style.filter =
                    `brightness(${brightnessLevel}%)`;

            });

            brightnessButton.style.background =
                brightnessLevel === 100
                ? "rgba(255,255,255,0.55)"
                : "#f9d5e5";

        });


        /* =================================
           SETTINGS PANEL
        ================================= */

        settingsButton.addEventListener("click", () => {

            settingsPanel.classList.toggle("active");

            chapterPanel.classList.remove("active");

        });


        document.getElementById("width-full")
            .addEventListener("click", () => {

                readerContainer.classList.remove(
                    "reader-narrow"
                );

                settingsPanel.classList.remove("active");

            });


        document.getElementById("width-narrow")
            .addEventListener("click", () => {

                readerContainer.classList.add(
                    "reader-narrow"
                );

                settingsPanel.classList.remove("active");

            });


        /* =================================
           CHAPTER LIST PANEL
        ================================= */

        chapterListButton.addEventListener("click", () => {

            chapterPanel.classList.toggle("active");

            settingsPanel.classList.remove("active");

        });


        /* =================================
           TAP TO HIDE / SHOW CONTROLS
        ================================= */

        document.addEventListener("click", event => {

            if (
                event.target.closest(
                    ".reader-header, .reader-settings, .reader-chapter-panel"
                )
            ) {
                return;
            }

            if (
                event.target.closest("a, button")
            ) {
                return;
            }

            settingsPanel.classList.remove("active");
            chapterPanel.classList.remove("active");

            document.body.classList.toggle(
                "controls-hidden"
            );

        });


        /* =================================
           IMAGE PROTECTION
        ================================= */

        document.addEventListener(
            "contextmenu",
            event => {

                if (
                    event.target.closest(".reader-page")
                ) {
                    event.preventDefault();
                }

            }
        );


        document.addEventListener(
            "dragstart",
            event => {

                if (
                    event.target.closest(".reader-page")
                ) {
                    event.preventDefault();
                }

            }
        );


        document.addEventListener(
            "selectstart",
            event => {

                if (
                    event.target.closest(".reader-page")
                ) {
                    event.preventDefault();
                }

            }
        );


        /* =================================
           PAGE READY
        ================================= */

        window.addEventListener(
            "pageshow",
            () => {

                requestAnimationFrame(() => {

                    document.body.classList.add(
                        "page-ready"
                    );

                    document.body.classList.remove(
                        "page-leaving"
                    );

                });

            }
        );

    </script>

</body>
</html>
