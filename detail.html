
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>รายละเอียดมังงะ | Yume Manga</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* =================================
           PAGE TRANSITION
        ================================= */

        body {
            opacity: 0;
            transition: opacity .5s ease;
        }

        body.page-ready { opacity: 1; }
        body.page-leaving { opacity: 0; }

        /* =================================
           MAIN CONTAINER
        ================================= */

        .detail-container {
            width: 94%;
            max-width: 1500px;
            margin: 35px auto 60px;
        }

        .back-button {
            display: inline-block;
            padding: 11px 20px;
            margin-bottom: 28px;
            border-radius: 13px;
            background: #ffe3ef;
            color: #d65c91;
            text-decoration: none;
            font-weight: bold;
            transition: .25s ease;
        }

        .back-button:hover {
            transform: translateX(-4px);
            box-shadow: 0 5px 15px rgba(214,92,145,.15);
        }

        /* =================================
           THREE COLUMN DETAIL LAYOUT
        ================================= */

        .detail-layout {
            display: grid;
            grid-template-columns: 260px minmax(0, 1fr) 320px;
            align-items: start;
            gap: 25px;
            width: 100%;
        }

        /* =================================
           COVER
        ================================= */

        .detail-box {
            position: relative;
            width: 100%;
            min-width: 0;
            aspect-ratio: 3 / 4;
            overflow: hidden;
            border-radius: 22px;
            background: #302631;
            box-shadow: 0 12px 35px rgba(100,50,75,.16);
            isolation: isolate;
            animation: detailZoomIn .7s ease both;
        }

        @keyframes detailZoomIn {
            from {
                opacity: 0;
                transform: translateY(18px) scale(.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .detail-cover {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center;
            z-index: -2;
            animation: coverReveal 1s ease both;
        }

        @keyframes coverReveal {
            from {
                opacity: .5;
                transform: scale(1.06);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .detail-cover-emoji {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 100px;
            background: linear-gradient(135deg,#ffd6e8,#f6b8d3);
            z-index: -2;
        }

        .detail-box::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                transparent,
                rgba(20,10,20,.08)
            );
            z-index: -1;
            pointer-events: none;
        }

        .detail-box::before {
            content: "✦";
            position: absolute;
            top: 8%;
            right: 9%;
            z-index: 1;
            color: white;
            font-size: 25px;
            opacity: 0;
            pointer-events: none;
            animation: detailSparkle 3.5s ease-in-out .8s infinite;
        }

        @keyframes detailSparkle {
            0%,100% {
                opacity: 0;
                transform: scale(.6) rotate(0);
            }
            50% {
                opacity: .9;
                transform: scale(1.15) rotate(45deg);
            }
        }

        /* =================================
           INFORMATION PANEL
        ================================= */

        .detail-info {
            position: relative;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            padding: 25px;
            border-radius: 22px;
            background: #fff;
            border: 1px solid #f5dce8;
            box-shadow: 0 10px 30px rgba(150,80,115,.07);
            color: #754b60;
            animation: infoReveal .7s ease both;
        }

        @keyframes infoReveal {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .detail-tag {
            display: inline-block;
            padding: 7px 16px;
            margin-bottom: 14px;
            border-radius: 30px;
            background: #ffe0ed;
            color: #c64f85;
            font-size: 13px;
            font-weight: bold;
        }

        .detail-info h1 {
            margin: 0 0 16px;
            color: #593b4c;
            font-size: clamp(23px,2.3vw,32px);
            line-height: 1.4;
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .detail-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }

        .detail-meta-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            max-width: 100%;
            box-sizing: border-box;
            padding: 8px 11px;
            border-radius: 11px;
            background: #fff0f6;
            border: 1px solid #f7dce8;
            color: #9c5878;
            font-size: 12px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        /* =================================
           SYNOPSIS
        ================================= */

        .detail-synopsis {
            display: -webkit-box !important;
            -webkit-box-orient: vertical !important;
            -webkit-line-clamp: 5 !important;
            width: 100%;
            max-height: 9em;
            box-sizing: border-box;
            margin: 0 0 12px;
            overflow: hidden !important;
            color: #806477;
            font-size: 14px;
            line-height: 1.85;
            overflow-wrap: anywhere;
            cursor: pointer;
            transition: color .2s ease;
        }

        .detail-synopsis:hover {
            color: #d65c91;
        }

        .synopsis-hint {
            display: block;
            margin-bottom: 20px;
            color: #c77b9e;
            font-size: 11px;
            cursor: pointer;
        }

        /* =================================
           ACTION BUTTONS
        ================================= */

        .detail-actions {
            display: flex !important;
            flex-wrap: wrap !important;
            gap: 10px !important;
            width: 100%;
            margin: 0 !important;
            padding: 0 !important;
        }

        .detail-action {
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 7px !important;
            min-height: 45px !important;
            padding: 11px 16px !important;
            box-sizing: border-box !important;
            border-radius: 13px !important;
            font-family: inherit !important;
            font-size: 13px !important;
            font-weight: bold !important;
            line-height: 1.5 !important;
            text-align: center !important;
            text-decoration: none !important;
            cursor: pointer !important;
            transition: .25s ease !important;
        }

        .detail-primary-action {
            background: #ff8fbd !important;
            color: #fff !important;
            border: 1px solid #ff8fbd !important;
            box-shadow: 0 5px 15px rgba(255,100,160,.2);
        }

        .detail-favorite-action {
            background: #fff0f6 !important;
            color: #d65c91 !important;
            border: 1px solid #f4c9dc !important;
        }

        .detail-favorite-action.selected {
            background: #ffe0ed !important;
            color: #e34e88 !important;
            border-color: #f2b8d1 !important;
        }

        .detail-action:active {
            transform: scale(.97) !important;
        }

        .detail-primary-action.disabled {
            opacity: .5;
            pointer-events: none;
        }

        /* =================================
           CHAPTER PANEL - RIGHT SIDE
        ================================= */

        .detail-section {
            width: 100%;
            min-width: 0;
            max-height: 680px;
            box-sizing: border-box;
            padding: 22px;
            overflow-y: auto;
            border-radius: 22px;
            background: #fff;
            border: 1px solid #f5dce8;
            box-shadow: 0 10px 30px rgba(150,80,115,.07);
            opacity: 0;
            transform: translateY(18px);
            transition: opacity .7s ease, transform .7s ease;
        }

        .detail-section.reveal-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .detail-section h2 {
            margin: 0 0 18px;
            color: #754b60;
            font-size: 20px;
            line-height: 1.5;
        }

        .chapter-list {
            display: grid;
            grid-template-columns: minmax(0,1fr);
            gap: 10px;
        }

        .chapter-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 13px 14px;
            border-radius: 13px;
            background: #fffafd;
            border: 1px solid #f4dce7;
            text-decoration: none;
            color: #754b60 !important;
            transition: .25s ease;
            animation: chapterAppear .5s ease both;
        }

        .chapter-item span:first-child {
            min-width: 0;
            color: #754b60 !important;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .chapter-item span:last-child {
            flex-shrink: 0;
            color: #d65c91 !important;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        @keyframes chapterAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chapter-item:hover {
            transform: translateY(-3px);
            border-color: #e9a4c3;
            background: #fff2f7;
            box-shadow: 0 7px 18px rgba(211,112,160,.12);
        }

        .chapter-item:active {
            transform: scale(.98);
        }

        .not-found {
            text-align: center;
            padding: 60px 15px;
        }

        /* =================================
           FULL SYNOPSIS MODAL
        ================================= */

        .synopsis-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            background: rgba(25,15,25,.65);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .3s ease, visibility .3s ease;
        }

        .synopsis-modal.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .synopsis-modal-content {
            position: relative;
            width: 100%;
            max-width: 620px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 28px;
            box-sizing: border-box;
            border-radius: 23px;
            background: linear-gradient(145deg,#fff8fb,#ffeaf3);
            box-shadow: 0 15px 45px rgba(40,15,30,.3);
            transform: translateY(20px) scale(.97);
            transition: transform .3s ease;
        }

        .synopsis-modal.open .synopsis-modal-content {
            transform: translateY(0) scale(1);
        }

        .synopsis-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid #f4d2e1;
        }

        .synopsis-modal-header h2 {
            margin: 0;
            color: #c64f85;
            font-size: 20px;
            font-weight: 800;
        }

        .synopsis-close {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            border: none;
            border-radius: 50%;
            background: #ffe0ed;
            color: #c64f85;
            font-size: 22px;
            cursor: pointer;
            transition: .2s ease;
        }

        .synopsis-close:hover {
            background: #ffc8df;
            transform: rotate(90deg);
        }

        .synopsis-full-text {
            margin: 0;
            color: #754b60;
            font-size: 15px;
            line-height: 2;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .synopsis-modal-footer {
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid #f4d2e1;
            color: #c77b9e;
            font-size: 12px;
            text-align: center;
        }

        /* =================================
           LAPTOP
        ================================= */

        @media (min-width: 701px) and (max-width: 1100px) {
            .detail-layout {
                grid-template-columns: 220px minmax(0,1fr) 270px;
                gap: 16px;
            }

            .detail-info {
                padding: 20px;
            }

            .detail-section {
                padding: 18px;
            }

            .detail-info h1 {
                font-size: 25px;
            }

            .chapter-item {
                padding: 11px;
            }

            .chapter-item span:first-child {
                font-size: 12px;
            }

            .chapter-item span:last-child {
                font-size: 11px;
            }
        }

        /* =================================
           TABLET
        ================================= */

        @media (min-width: 601px) and (max-width: 900px) {
            .detail-layout {
                grid-template-columns: 220px minmax(0,1fr);
            }

            .detail-section {
                grid-column: 1 / -1;
                max-height: none;
            }

            .chapter-list {
                grid-template-columns: repeat(2,minmax(0,1fr));
            }
        }

        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {
            .detail-container {
                width: 94%;
                margin: 22px auto 40px;
            }

            .back-button {
                margin-bottom: 20px;
                padding: 10px 17px;
                font-size: 13px;
            }

            .detail-layout {
                grid-template-columns: minmax(0,1fr);
                gap: 17px;
            }

            .detail-box {
                width: 100%;
                max-width: 340px;
                aspect-ratio: 3 / 4;
                margin: 0 auto;
                border-radius: 20px;
            }

            .detail-info {
                padding: 20px;
                border-radius: 18px;
            }

            .detail-info h1 {
                font-size: clamp(22px,6vw,28px);
            }

            .detail-meta {
                gap: 6px;
            }

            .detail-meta-item {
                font-size: 11px;
                padding: 7px 9px;
            }

            .detail-synopsis {
                font-size: 13px;
                -webkit-line-clamp: 4 !important;
                max-height: 7.4em;
            }

            .detail-actions {
                display: grid !important;
                grid-template-columns: minmax(0,1fr) !important;
            }

            .detail-action {
                width: 100% !important;
                min-height: 44px !important;
                white-space: normal !important;
                font-size: 13px !important;
            }

            .detail-section {
                max-height: none;
                padding: 19px;
                border-radius: 18px;
            }

            .detail-section h2 {
                font-size: 19px;
            }

            .chapter-list {
                grid-template-columns: minmax(0,1fr);
            }

            .chapter-item {
                padding: 13px;
            }

            .chapter-item span:first-child {
                font-size: 13px;
            }

            .synopsis-modal {
                padding: 16px;
            }

            .synopsis-modal-content {
                max-height: 82vh;
                padding: 21px;
                border-radius: 20px;
            }

            .synopsis-modal-header h2 {
                font-size: 17px;
            }

            .synopsis-full-text {
                font-size: 14px;
                line-height: 1.9;
            }
        }

        @media (max-width: 380px) {
            .detail-info {
                padding: 16px;
            }

            .detail-info h1 {
                font-size: 21px;
            }
        }

        /* =================================
           TOUCH DEVICE
        ================================= */

        @media (hover: none) {
            .detail-action:hover,
            .back-button:hover,
            .chapter-item:hover {
                transform: none !important;
                box-shadow: none !important;
            }
        }

        /* =================================
           REDUCED MOTION
        ================================= */

        @media (prefers-reduced-motion: reduce) {
            body {
                transition: none;
                opacity: 1 !important;
            }

            body.page-leaving {
                opacity: 1 !important;
            }

            .detail-box,
            .detail-box::before,
            .detail-cover,
            .detail-info,
            .detail-section,
            .chapter-item {
                animation: none !important;
                transition: none !important;
            }

            .synopsis-modal,
            .synopsis-modal-content {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <main class="detail-container">

        <a href="index.html" class="back-button" id="back-home">
            ← กลับหน้าแรก
        </a>

        <div id="detail-content"></div>

    </main>

    <script src="script.js"></script>

    <script>
        /* =================================
           FIND MANGA
        ================================= */

        const params = new URLSearchParams(window.location.search);
        const mangaId = params.get("id");

        const manga = window.mangaData?.find(
            item => String(item.id) === String(mangaId)
        );

        const detailContent = document.getElementById("detail-content");


        /* =================================
           READING HISTORY SYSTEM
        ================================= */

        function getReadingHistory() {
            try {
                const history = JSON.parse(
                    localStorage.getItem("yumeReadingHistory") || "{}"
                );

                return history && typeof history === "object"
                    ? history
                    : {};

            } catch (error) {
                return {};
            }
        }


        /* =================================
           PAGE TRANSITION
        ================================= */

        function navigateWithFade(url) {
            if (
                window.matchMedia(
                    "(prefers-reduced-motion: reduce)"
                ).matches
            ) {
                window.location.href = url;
                return;
            }

            document.body.classList.remove("page-ready");
            document.body.classList.add("page-leaving");

            setTimeout(() => {
                window.location.href = url;
            }, 500);
        }


        /* =================================
           FAVORITES SYSTEM
        ================================= */

        function getFavoriteIds() {
            try {
                const saved = JSON.parse(
                    localStorage.getItem("yumeFavorites") || "[]"
                );

                return Array.isArray(saved) ? saved : [];

            } catch (error) {
                return [];
            }
        }


        function updateFavoriteButton() {
            const button = document.getElementById("detail-favorite");

            if (!button || !manga) return;

            const favoriteIds = getFavoriteIds();

            const isFavorite = favoriteIds.includes(Number(manga.id));

            button.classList.toggle("selected", isFavorite);

            button.setAttribute(
                "aria-pressed",
                String(isFavorite)
            );

            button.textContent = isFavorite
                ? "♥ อยู่ในรายการโปรด"
                : "♡ เพิ่มรายการโปรด";
        }


        function toggleDetailFavorite() {
            if (!manga) return;

            const favoriteIds = getFavoriteIds();
            const id = Number(manga.id);
            const index = favoriteIds.indexOf(id);

            if (index === -1) {
                favoriteIds.push(id);
            } else {
                favoriteIds.splice(index, 1);
            }

            localStorage.setItem(
                "yumeFavorites",
                JSON.stringify(favoriteIds)
            );

            updateFavoriteButton();
        }


        /* =================================
           SYNOPSIS MODAL
        ================================= */

        function openSynopsis() {
            const modal = document.getElementById("synopsis-modal");

            if (!modal) return;

            modal.classList.add("open");
            document.body.style.overflow = "hidden";

            document.getElementById("synopsis-close")?.focus();
        }


        function closeSynopsis() {
            const modal = document.getElementById("synopsis-modal");

            if (!modal) return;

            modal.classList.remove("open");
            document.body.style.overflow = "";
        }


        /* =================================
           RENDER DETAIL
        ================================= */

        if (manga) {

            const isImage =
                typeof manga.cover === "string" &&
                /^https?:\/\//i.test(manga.cover);

            const cover = isImage

                ? `
                    <img
                        class="detail-cover"
                        src="${manga.cover}"
                        alt="${manga.title}"
                    >
                `

                : `
                    <div class="detail-cover-emoji">
                        ${manga.cover || "🌸"}
                    </div>
                `;


            const chapters = Array.isArray(manga.chapters)
                ? manga.chapters
                : [];

            const synopsisText = manga.synopsis ||
                "เรื่องราวการผจญภัยที่รอให้คุณค้นพบ 🌸";


            /* =================================
               RESUME READING
            ================================= */

            const readingHistory = getReadingHistory();

            const savedProgress =
                readingHistory[String(manga.id)];

            const hasReadingHistory =
                savedProgress &&
                Number.isInteger(savedProgress.chapter) &&
                savedProgress.chapter >= 0 &&
                savedProgress.chapter < chapters.length;

            const resumeChapter = hasReadingHistory
                ? savedProgress.chapter
                : 0;

            const continueChapterLink = chapters.length > 0

                ? `reader.html?id=${encodeURIComponent(manga.id)}&chapter=${resumeChapter}`

                : "#";

            const continueButtonText = hasReadingHistory

                ? `📖 อ่านต่อ ${savedProgress.title || `ตอนที่ ${resumeChapter + 1}`}`

                : "📖 อ่านตอนแรก";


            /* =================================
               CHAPTER LIST
            ================================= */

            const chaptersHTML = chapters.length > 0

                ? chapters.map((chapter, index) => {

                    const isLastRead =
                        hasReadingHistory &&
                        index === resumeChapter;

                    return `
                        <a
                            class="chapter-item"
                            href="reader.html?id=${encodeURIComponent(manga.id)}&chapter=${index}"
                        >
                            <span>
                                ${isLastRead ? "📌 " : "📖 "}
                                ${chapter.title || `ตอนที่ ${index + 1}`}
                                ${isLastRead ? " (อ่านล่าสุด)" : ""}
                            </span>

                            <span>อ่านตอนนี้ →</span>
                        </a>
                    `;

                }).join("")

                : `
                    <p>ยังไม่มีตอนให้อ่านในขณะนี้ 🌸</p>
                `;


            /* =================================
               DETAIL HTML
            ================================= */

            detailContent.innerHTML = `

                <div class="detail-layout">

                    <!-- LEFT: COVER -->

                    <section class="detail-box">
                        ${cover}
                    </section>


                    <!-- CENTER: INFORMATION -->

                    <section class="detail-info">

                        <span class="detail-tag">
                            ${manga.status || "มังงะ"}
                        </span>

                        <h1>${manga.title}</h1>

                        <div class="detail-meta">

                            <span class="detail-meta-item">
                                ✍️ ${manga.author || "ไม่ระบุ"}
                            </span>

                            <span class="detail-meta-item">
                                📚 ${manga.genre || "ไม่ระบุ"}
                            </span>

                            <span class="detail-meta-item">
                                ⭐ ${manga.rating || "ยังไม่มีคะแนน"}
                            </span>

                        </div>

                        <p
                            class="detail-synopsis"
                            id="detail-synopsis"
                            role="button"
                            tabindex="0"
                            aria-label="แตะเพื่ออ่านเรื่องย่อฉบับเต็ม"
                        >
                            ${synopsisText}
                        </p>

                        <span class="synopsis-hint">
                            แตะเพื่ออ่านเรื่องย่อฉบับเต็ม ✨
                        </span>

                        <div class="detail-actions">

                            <a
                                class="detail-action detail-primary-action ${chapters.length === 0 ? "disabled" : ""}"
                                href="${continueChapterLink}"
                                ${chapters.length === 0 ? 'aria-disabled="true"' : ""}
                            >
                                ${continueButtonText}
                            </a>

                            <button
                                type="button"
                                class="detail-action detail-favorite-action"
                                id="detail-favorite"
                                aria-pressed="false"
                            >
                                ♡ เพิ่มรายการโปรด
                            </button>

                        </div>

                    </section>


                    <!-- RIGHT: CHAPTER LIST -->

                    <section class="detail-section">

                        <h2>📖 รายชื่อตอน</h2>

                        <div class="chapter-list">
                            ${chaptersHTML}
                        </div>

                    </section>

                </div>


                <!-- FULL SYNOPSIS MODAL -->

                <div
                    class="synopsis-modal"
                    id="synopsis-modal"
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby="synopsis-modal-title"
                >

                    <div class="synopsis-modal-content">

                        <div class="synopsis-modal-header">

                            <h2 id="synopsis-modal-title">
                                🌸 เรื่องย่อฉบับเต็ม
                            </h2>

                            <button
                                type="button"
                                class="synopsis-close"
                                id="synopsis-close"
                                aria-label="ปิดหน้าต่าง"
                            >
                                ×
                            </button>

                        </div>

                        <p class="synopsis-full-text">
                            ${synopsisText}
                        </p>

                        <div class="synopsis-modal-footer">
                            Yume Manga · อ่านเรื่องย่อ
                        </div>

                    </div>

                </div>

            `;


            /* =================================
               SYNOPSIS EVENTS
            ================================= */

            const synopsisButton = document.getElementById(
                "detail-synopsis"
            );

            const synopsisModal = document.getElementById(
                "synopsis-modal"
            );

            const synopsisClose = document.getElementById(
                "synopsis-close"
            );

            synopsisButton.addEventListener("click", openSynopsis);

            synopsisButton.addEventListener("keydown", event => {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {
                    event.preventDefault();
                    openSynopsis();
                }

            });

            synopsisClose.addEventListener("click", closeSynopsis);

            synopsisModal.addEventListener("click", event => {

                if (event.target === synopsisModal) {
                    closeSynopsis();
                }

            });

            document.addEventListener("keydown", event => {

                if (
                    event.key === "Escape" &&
                    synopsisModal.classList.contains("open")
                ) {
                    closeSynopsis();
                }

            });


            /* =================================
               FAVORITE EVENT
            ================================= */

            updateFavoriteButton();

            document
                .getElementById("detail-favorite")
                .addEventListener("click", toggleDetailFavorite);


            /* =================================
               SCROLL REVEAL
            ================================= */

            const revealSections = document.querySelectorAll(
                ".detail-section"
            );

            if ("IntersectionObserver" in window) {

                const revealObserver = new IntersectionObserver(
                    entries => {

                        entries.forEach(entry => {

                            if (entry.isIntersecting) {

                                entry.target.classList.add(
                                    "reveal-visible"
                                );

                                revealObserver.unobserve(entry.target);
                            }

                        });

                    },
                    {
                        threshold: 0.05
                    }
                );

                revealSections.forEach(section => {
                    revealObserver.observe(section);
                });

            } else {

                revealSections.forEach(section => {
                    section.classList.add("reveal-visible");
                });

            }

        } else {

            detailContent.innerHTML = `

                <div class="not-found">

                    <h2>ไม่พบมังงะเรื่องนี้ 🌸</h2>

                    <p>ลองกลับไปเลือกเรื่องอื่นดูนะ</p>

                </div>

            `;

        }


        /* =================================
           CHAPTER CLICK TRANSITION
        ================================= */

        detailContent.addEventListener("click", event => {

            const link = event.target.closest(
                ".chapter-item, .detail-primary-action"
            );

            if (!link) return;

            if (link.classList.contains("disabled")) {
                event.preventDefault();
                return;
            }

            if (
                !link.href ||
                link.getAttribute("href") === "#"
            ) {
                return;
            }

            event.preventDefault();

            navigateWithFade(link.href);

        });


        /* =================================
           PAGE TRANSITION
        ================================= */

        window.addEventListener("pageshow", () => {

            requestAnimationFrame(() => {

                document.body.classList.add("page-ready");

                document.body.classList.remove("page-leaving");

            });

        });


        /* =================================
           BACK TO HOME
        ================================= */

        document
            .getElementById("back-home")
            .addEventListener("click", event => {

                event.preventDefault();

                navigateWithFade("index.html");

            });

    </script>

</body>
</html>
