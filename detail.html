<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>รายละเอียดมังงะ | Yume Manga</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* =================================
           PAGE TRANSITION
        ================================= */

        body {
            opacity: 0;
            transition: opacity .5s ease;
        }

        body.page-ready { opacity: 1; }
        body.page-leaving { opacity: 0; }

        /* =================================
           MAIN CONTAINER
        ================================= */

        .detail-container {
            width: 94%;
            max-width: 1500px;
            margin: 35px auto 60px;
        }

        .back-button {
            display: inline-block;
            padding: 11px 20px;
            margin-bottom: 28px;
            border-radius: 13px;
            background: #ffe3ef;
            color: #d65c91;
            text-decoration: none;
            font-weight: bold;
            transition: .25s ease;
        }

        .back-button:hover {
            transform: translateX(-4px);
            box-shadow: 0 5px 15px rgba(214,92,145,.15);
        }

        /* =================================
           THREE COLUMN DETAIL LAYOUT
        ================================= */

        .detail-layout {
            display: grid;
            grid-template-columns: 260px minmax(0, 1fr) 320px;
            align-items: start;
            gap: 25px;
            width: 100%;
        }

        /* =================================
           COVER
        ================================= */

        .detail-box {
            position: relative;
            width: 100%;
            min-width: 0;
            aspect-ratio: 3 / 4;
            overflow: hidden;
            border-radius: 22px;
            background: #302631;
            box-shadow: 0 12px 35px rgba(100,50,75,.16);
            isolation: isolate;
            animation: detailZoomIn .7s ease both;
        }

        @keyframes detailZoomIn {
            from {
                opacity: 0;
                transform: translateY(18px) scale(.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .detail-cover {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center;
            z-index: -2;
            animation: coverReveal 1s ease both;
        }

        @keyframes coverReveal {
            from {
                opacity: .5;
                transform: scale(1.06);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .detail-cover-emoji {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 100px;
            background: linear-gradient(135deg,#ffd6e8,#f6b8d3);
            z-index: -2;
        }

        .detail-box::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                transparent,
                rgba(20,10,20,.08)
            );
            z-index: -1;
            pointer-events: none;
        }

        .detail-box::before {
            content: "✦";
            position: absolute;
            top: 8%;
            right: 9%;
            z-index: 1;
            color: white;
            font-size: 25px;
            opacity: 0;
            pointer-events: none;
            animation: detailSparkle 3.5s ease-in-out .8s infinite;
        }

        @keyframes detailSparkle {
            0%,100% {
                opacity: 0;
                transform: scale(.6) rotate(0);
            }

            50% {
                opacity: .9;
                transform: scale(1.15) rotate(45deg);
            }
        }

        /* =================================
           INFORMATION PANEL - DESKTOP
        ================================= */

        .detail-info {
            position: relative;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            padding: 25px;
            border-radius: 22px;
            background: #fff;
            border: 1px solid #f5dce8;
            box-shadow: 0 10px 30px rgba(150,80,115,.07);
            color: #754b60;
            animation: infoReveal .7s ease both;
        }

        @keyframes infoReveal {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .detail-tag {
            display: inline-block;
            padding: 7px 16px;
            margin-bottom: 14px;
            border-radius: 30px;
            background: #ffe0ed;
            color: #c64f85;
            font-size: 13px;
            font-weight: bold;
        }

        .detail-info h1 {
            margin: 0 0 16px;
            color: #593b4c;
            font-size: clamp(23px,2.3vw,32px);
            line-height: 1.4;
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .detail-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }

        .detail-meta-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            max-width: 100%;
            box-sizing: border-box;
            padding: 8px 11px;
            border-radius: 11px;
            background: #fff0f6;
            border: 1px solid #f7dce8;
            color: #9c5878;
            font-size: 12px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        /* =================================
           SYNOPSIS
        ================================= */

        .detail-synopsis {
            display: -webkit-box !important;
            -webkit-box-orient: vertical !important;
            -webkit-line-clamp: 5 !important;
            width: 100%;
            max-height: 9em;
            box-sizing: border-box;
            margin: 0 0 12px;
            overflow: hidden !important;
            color: #806477;
            font-size: 14px;
            line-height: 1.85;
            overflow-wrap: anywhere;
            cursor: pointer;
            transition: color .2s ease;
        }

        .detail-synopsis:hover {
            color: #d65c91;
        }

        .synopsis-hint {
            display: block;
            margin-bottom: 20px;
            color: #c77b9e;
            font-size: 11px;
            cursor: pointer;
        }

        /* =================================
           ACTION BUTTONS
        ================================= */

        .detail-actions {
            display: flex !important;
            flex-wrap: wrap !important;
            gap: 10px !important;
            width: 100%;
            margin: 0 !important;
            padding: 0 !important;
        }

        .detail-action {
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 7px !important;
            min-height: 45px !important;
            padding: 11px 16px !important;
            box-sizing: border-box !important;
            border-radius: 13px !important;
            font-family: inherit !important;
            font-size: 13px !important;
            font-weight: bold !important;
            line-height: 1.5 !important;
            text-align: center !important;
            text-decoration: none !important;
            cursor: pointer !important;
            transition: .25s ease !important;
        }

        .detail-primary-action {
            background: #ff8fbd !important;
            color: #fff !important;
            border: 1px solid #ff8fbd !important;
            box-shadow: 0 5px 15px rgba(255,100,160,.2);
        }

        .detail-favorite-action {
            background: #fff0f6 !important;
            color: #d65c91 !important;
            border: 1px solid #f4c9dc !important;
        }

        .detail-favorite-action.selected {
            background: #ffe0ed !important;
            color: #e34e88 !important;
            border-color: #f2b8d1 !important;
        }

        .detail-action:active {
            transform: scale(.97) !important;
        }

        .detail-primary-action.disabled {
            opacity: .5;
            pointer-events: none;
        }

        /* =================================
           CHAPTER PANEL - RIGHT SIDE
        ================================= */

        .detail-section {
            width: 100%;
            min-width: 0;
            max-height: 680px;
            box-sizing: border-box;
            padding: 22px;
            overflow-y: auto;
            border-radius: 22px;
            background: #fff;
            border: 1px solid #f5dce8;
            box-shadow: 0 10px 30px rgba(150,80,115,.07);
            opacity: 0;
            transform: translateY(18px);
            transition: opacity .7s ease, transform .7s ease;
        }

        .detail-section.reveal-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .detail-section h2 {
            margin: 0 0 18px;
            color: #754b60;
            font-size: 20px;
            line-height: 1.5;
        }

        .chapter-list {
            display: grid;
            grid-template-columns: minmax(0,1fr);
            gap: 10px;
        }

        .chapter-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 13px 14px;
            border-radius: 13px;
            background: #fffafd;
            border: 1px solid #f4dce7;
            text-decoration: none;
            color: #754b60 !important;
            transition: .25s ease;
            animation: chapterAppear .5s ease both;
        }

        .chapter-item span:first-child {
            min-width: 0;
            color: #754b60 !important;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .chapter-item span:last-child {
            flex-shrink: 0;
            color: #d65c91 !important;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        @keyframes chapterAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chapter-item:hover {
            transform: translateY(-3px);
            border-color: #e9a4c3;
            background: #fff2f7;
            box-shadow: 0 7px 18px rgba(211,112,160,.12);
        }

        .chapter-item:active {
            transform: scale(.98);
        }

        .not-found {
            text-align: center;
            padding: 60px 15px;
        }

        /* =================================
           FULL SYNOPSIS MODAL
        ================================= */

        .synopsis-modal {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            background: rgba(25,15,25,.65);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .3s ease, visibility .3s ease;
        }

        .synopsis-modal.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .synopsis-modal-content {
            position: relative;
            width: 100%;
            max-width: 620px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 28px;
            box-sizing: border-box;
            border-radius: 23px;
            background: linear-gradient(145deg,#fff8fb,#ffeaf3);
            box-shadow: 0 15px 45px rgba(40,15,30,.3);
            transform: translateY(20px) scale(.97);
            transition: transform .3s ease;
        }

        .synopsis-modal.open .synopsis-modal-content {
            transform: translateY(0) scale(1);
        }

        .synopsis-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid #f4d2e1;
        }

        .synopsis-modal-header h2 {
            margin: 0;
            color: #c64f85;
            font-size: 20px;
            font-weight: 800;
        }

        .synopsis-close {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            border: none;
            border-radius: 50%;
            background: #ffe0ed;
            color: #c64f85;
            font-size: 22px;
            cursor: pointer;
            transition: .2s ease;
        }

        .synopsis-close:hover {
            background: #ffc8df;
            transform: rotate(90deg);
        }

        .synopsis-full-text {
            margin: 0;
            color: #754b60;
            font-size: 15px;
            line-height: 2;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .synopsis-modal-footer {
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid #f4d2e1;
            color: #c77b9e;
            font-size: 12px;
            text-align: center;
        }

        /* =================================
           LAPTOP
        ================================= */

        @media (min-width: 701px) and (max-width: 1100px) {
            .detail-layout {
                grid-template-columns: 220px minmax(0,1fr) 270px;
                gap: 16px;
            }

            .detail-info {
                padding: 20px;
            }

            .detail-section {
                padding: 18px;
            }

            .detail-info h1 {
                font-size: 25px;
            }

            .chapter-item {
                padding: 11px;
            }

            .chapter-item span:first-child {
                font-size: 12px;
            }

            .chapter-item span:last-child {
                font-size: 11px;
            }
        }

        /* =================================
           TABLET
        ================================= */

        @media (min-width: 601px) and (max-width: 900px) {
            .detail-layout {
                grid-template-columns: 220px minmax(0,1fr);
            }

            .detail-section {
                grid-column: 1 / -1;
                max-height: none;
            }

            .chapter-list {
                grid-template-columns: repeat(2,minmax(0,1fr));
            }
        }

        /* =================================
           MOBILE - ORIGINAL STYLE
           COVER + INFO OVERLAY
        ================================= */

        @media (max-width: 600px) {

            .detail-container {
                width: 94%;
                margin: 22px auto 40px;
            }

            .back-button {
                margin-bottom: 20px;
                padding: 10px 17px;
                font-size: 13px;
            }

            .detail-layout {
                display: grid;
                grid-template-columns: minmax(0,1fr);
                gap: 17px;
            }

            /* ปกและข้อมูลใช้พื้นที่เดียวกัน */

            .detail-box,
            .detail-info {
                grid-column: 1;
                grid-row: 1;
            }

            .detail-box {
                width: 100%;
                max-width: 340px;
                aspect-ratio: 3 / 4;
                margin: 0 auto;
                border-radius: 20px;
            }

            /* เพิ่มเงาด้านล่างให้ตัวหนังสืออ่านง่าย */

            .detail-box::after {
                background: linear-gradient(
                    to bottom,
                    rgba(20,10,20,0) 0%,
                    rgba(20,10,20,.04) 25%,
                    rgba(20,10,20,.35) 48%,
                    rgba(20,10,20,.78) 72%,
                    rgba(20,10,20,.94) 100%
                );
            }

            /* ข้อมูลซ้อนอยู่บนปก */

            .detail-info {
                position: relative;
                z-index: 2;
                align-self: end;
                width: 100%;
                max-width: 340px;
                margin: 0 auto;
                padding: 17px;
                border: none;
                border-radius: 0 0 20px 20px;
                background: transparent;
                box-shadow: none;
                color: #fff;
            }

            .detail-tag {
                padding: 6px 13px;
                margin-bottom: 10px;
                font-size: 11px;
                background: #ffb9d8;
                color: #963d68;
            }

            .detail-info h1 {
                margin-bottom: 10px;
                color: #fff;
                font-size: clamp(21px,6vw,27px);
                line-height: 1.35;
                text-shadow: 0 2px 10px rgba(0,0,0,.4);
            }

            .detail-meta {
                gap: 6px;
                margin-bottom: 10px;
            }

            .detail-meta-item {
                padding: 6px 8px;
                border-radius: 9px;
                background: rgba(255,255,255,.17);
                border: 1px solid rgba(255,255,255,.25);
                color: #fff;
                font-size: 10px;
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
            }

            .detail-synopsis {
                -webkit-line-clamp: 3 !important;
                max-height: 5.55em;
                margin-bottom: 10px;
                color: rgba(255,255,255,.94);
                font-size: 12px;
                line-height: 1.85;
            }

            .detail-synopsis:hover {
                color: #ffc4df;
            }

            .synopsis-hint {
                margin-top: -5px;
                margin-bottom: 12px;
                color: rgba(255,255,255,.75);
                font-size: 10px;
            }

            /* ปุ่มบนปก */

            .detail-actions {
                display: grid !important;
                grid-template-columns: minmax(0,1fr) !important;
                gap: 8px !important;
            }

            .detail-action {
                display: flex !important;
                width: 100% !important;
                min-height: 41px !important;
                padding: 9px 12px !important;
                border-radius: 12px !important;
                font-size: 12px !important;
                white-space: normal !important;
            }

            .detail-primary-action {
                background: #ff8fbd !important;
                color: #fff !important;
                border: 1px solid #ff8fbd !important;
                box-shadow: 0 4px 12px rgba(255,100,160,.25);
            }

            .detail-favorite-action {
                background: rgba(255,255,255,.18) !important;
                color: #fff !important;
                border: 1px solid rgba(255,255,255,.5) !important;
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
            }

            .detail-favorite-action.selected {
                background: #fff0f5 !important;
                color: #e34e88 !important;
                border: 1px solid #fff0f5 !important;
            }

            /* รายชื่อตอนอยู่ด้านล่างปก */

            .detail-section {
                grid-column: 1;
                grid-row: 2;
                width: 100%;
                max-height: none;
                padding: 19px;
                border-radius: 18px;
            }

            .detail-section h2 {
                font-size: 19px;
                margin-bottom: 15px;
            }

            .chapter-list {
                grid-template-columns: minmax(0,1fr);
                gap: 9px;
            }

            .chapter-item {
                padding: 13px;
                border-radius: 12px;
            }

            .chapter-item span:first-child {
                font-size: 13px;
            }

            .chapter-item span:last-child {
                font-size: 11px;
            }

            /* เรื่องย่อฉบับเต็ม */

            .synopsis-modal {
                padding: 16px;
            }

            .synopsis-modal-content {
                max-height: 82vh;
                padding: 21px;
                border-radius: 20px;
            }

            .synopsis-modal-header h2 {
                font-size: 17px;
            }

            .synopsis-full-text {
                font-size: 14px;
                line-height: 1.9;
            }
        }

        /* =================================
           SMALL MOBILE
        ================================= */

        @media (max-width: 380px) {

            .detail-container {
                width: 95%;
            }

            .detail-box {
                max-width: 320px;
            }

            .detail-info {
                max-width: 320px;
                padding: 14px;
            }

            .detail-info h1 {
                font-size: 21px;
            }

            .detail-meta-item {
                font-size: 9px;
                padding: 5px 7px;
            }

            .detail-synopsis {
                font-size: 11px;
            }

            .detail-action {
                min-height: 39px !important;
                font-size: 11px !important;
            }
        }

        /* =================================
           TOUCH DEVICE
        ================================= */

        @media (hover: none) {

            .detail-action:hover,
            .back-button:hover,
            .chapter-item:hover {
                transform: none !important;
                box-shadow: none !important;
            }
        }

        /* =================================
           REDUCED MOTION
        ================================= */

        @media (prefers-reduced-motion: reduce) {

            body {
                transition: none;
                opacity: 1 !important;
            }

            body.page-leaving {
                opacity: 1 !important;
            }

            .detail-box,
            .detail-box::before,
            .detail-cover,
            .detail-info,
            .detail-section,
            .chapter-item {
                animation: none !important;
                transition: none !important;
            }

            .synopsis-modal,
            .synopsis-modal-content {
                transition: none !important;
            }
        }
    </style>
</head>

/* =================================
   MANGA TRANSLATIONS
================================= */

const mangaLanguageData = {

    1: {
        ja: {
            synopsis: "ミナト・セノの高校生活が始まったばかりの頃、担任の先生から、いつも眠そうにしている猫のような少女、ネコセネの世話を頼まれる。内気で人と話すのが苦手なミナトは、彼女とほとんど話したこともなく、顔もよく見たことがなかった。しかし、勇気を出して彼女を起こすと、突然抱きつかれてしまう！",
            genre: "ラブコメ / 恋愛",
            status: "おすすめ"
        },

        en: {
            synopsis: "Minato Seno's high school life has just begun when his homeroom teacher asks him to look after Nekosene, a cat-like girl who is always sleeping. Minato is shy and struggles to stand up for himself. He has barely spoken to her and has hardly ever seen her face clearly. But when he finally gathers the courage to wake her up, she suddenly hugs him!",
            genre: "Romantic Comedy / Romance",
            status: "Recommended"
        }
    }
};

/* =================================
   LANGUAGE HELPERS
================================= */

function getText(key) {
    return detailTranslations[currentLanguage][key]
        || detailTranslations.th[key]
        || key;
}

function getLocalizedManga(key, fallback) {

    const translated =
        mangaLanguageData[manga?.id]?.[currentLanguage]?.[key];

    return translated || fallback || "";
}

function getChapterTitle(index) {

    if (currentLanguage === "ja") {
        return `第${index + 1}話`;
    }

    if (currentLanguage === "en") {
        return `Chapter ${index + 1}`;
    }

    return `ตอนที่ ${index + 1}`;
}

function getStatus(status) {

    if (!status) return getText("manga");

    if (status === "แนะนำ") {
        return getLocalizedManga("status", getText("recommended"));
    }

    if (status === "ใหม่") {
        return getText("new");
    }

    return status;
}

/* =================================
   STORAGE
================================= */

function getReadingHistory() {

    try {

        const history = JSON.parse(
            localStorage.getItem("yumeReadingHistory") || "{}"
        );

        return history && typeof history === "object"
            ? history
            : {};

    } catch (error) {
        return {};
    }

}

function getFavoriteIds() {

    try {

        const saved = JSON.parse(
            localStorage.getItem("yumeFavorites") || "[]"
        );

        return Array.isArray(saved) ? saved.map(Number) : [];

    } catch (error) {
        return [];
    }

}

/* =================================
   PAGE TRANSITION
================================= */

function navigateWithFade(url) {

    if (
        window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        ).matches
    ) {
        window.location.href = url;
        return;
    }

    document.body.classList.remove("page-ready");
    document.body.classList.add("page-leaving");

    setTimeout(() => {
        window.location.href = url;
    }, 500);

}

/* =================================
   SYNOPSIS MODAL
================================= */

function openSynopsis() {

    const modal = document.getElementById("synopsis-modal");

    if (!modal) return;

    modal.classList.add("open");
    document.body.style.overflow = "hidden";

    document.getElementById("synopsis-close")?.focus();

}

function closeSynopsis() {

    const modal = document.getElementById("synopsis-modal");

    if (!modal) return;

    modal.classList.remove("open");
    document.body.style.overflow = "";

}

/* =================================
   FAVORITES
================================= */

function updateFavoriteButton() {

    const button = document.getElementById("detail-favorite");

    if (!button || !manga) return;

    const isFavorite = getFavoriteIds().includes(Number(manga.id));

    button.classList.toggle("selected", isFavorite);

    button.setAttribute(
        "aria-pressed",
        String(isFavorite)
    );

    button.textContent = isFavorite
        ? getText("favorited")
        : getText("favorite");

}

function toggleDetailFavorite() {

    if (!manga) return;

    const favoriteIds = getFavoriteIds();
    const id = Number(manga.id);

    const index = favoriteIds.indexOf(id);

    if (index === -1) {
        favoriteIds.push(id);
    } else {
        favoriteIds.splice(index, 1);
    }

    localStorage.setItem(
        "yumeFavorites",
        JSON.stringify(favoriteIds)
    );

    updateFavoriteButton();

}

/* =================================
   RENDER DETAIL
================================= */

function renderDetail() {

    if (!manga) {

        detailContent.innerHTML = `
            <div class="not-found">
                <h2>${getText("notFound")}</h2>
                <p>${getText("notFoundMessage")}</p>
            </div>
        `;

        return;
    }

    const isImage =
        typeof manga.cover === "string" &&
        /^https?:\/\//i.test(manga.cover);

    const cover = isImage

        ? `
            <img
                class="detail-cover"
                src="${manga.cover}"
                alt="${manga.title}"
            >
        `

        : `
            <div class="detail-cover-emoji">
                ${manga.cover || "🌸"}
            </div>
        `;

    const chapters = Array.isArray(manga.chapters)
        ? manga.chapters
        : [];

    const synopsisText = getLocalizedManga(
        "synopsis",
        manga.synopsis || getText("synopsisDefault")
    );

    /* =================================
       READING HISTORY
    ================================= */

    const readingHistory = getReadingHistory();

    const savedProgress = readingHistory[String(manga.id)];

    const hasReadingHistory =
        savedProgress &&
        Number.isInteger(savedProgress.chapter) &&
        savedProgress.chapter >= 0 &&
        savedProgress.chapter < chapters.length;

    const resumeChapter = hasReadingHistory
        ? savedProgress.chapter
        : 0;

    const continueChapterLink = chapters.length > 0

        ? `reader.html?id=${encodeURIComponent(manga.id)}&chapter=${resumeChapter}`

        : "#";

    const continueButtonText = hasReadingHistory

        ? `${getText("continue")} ${getChapterTitle(resumeChapter)}`
        
        : getText("readFirst");

    /* =================================
       CHAPTER LIST
    ================================= */

    const chaptersHTML = chapters.length > 0

        ? chapters.map((chapter, index) => {

            const isLastRead =
                hasReadingHistory &&
                index === resumeChapter;

            return `
                <a
                    class="chapter-item"
                    href="reader.html?id=${encodeURIComponent(manga.id)}&chapter=${index}"
                >
                    <span>
                        ${isLastRead ? "📌 " : "📖 "}
                        ${getChapterTitle(index)}
                        ${isLastRead ? getText("lastRead") : ""}
                    </span>

                    <span>${getText("readNow")}</span>
                </a>
            `;

        }).join("")

        : `
            <p>${getText("emptyChapters")}</p>
        `;

    /* =================================
       DETAIL HTML
    ================================= */

    detailContent.innerHTML = `

        <div class="detail-layout">

            <section class="detail-box">
                ${cover}
            </section>

            <section class="detail-info">

                <span class="detail-tag">
                    ${getStatus(manga.status)}
                </span>

                <h1>${manga.title}</h1>

                <div class="detail-meta">

                    <span class="detail-meta-item">
                        ✍️ ${getText("author")}:
                        ${manga.author || getText("noAuthor")}
                    </span>

                    <span class="detail-meta-item">
                        📚 ${getText("genre")}:
                        ${getLocalizedManga("genre", manga.genre || getText("noGenre"))}
                    </span>

                    <span class="detail-meta-item">
                        ⭐ ${getText("rating")}:
                        ${manga.rating || getText("noRating")}
                    </span>

                </div>

                <p
                    class="detail-synopsis"
                    id="detail-synopsis"
                    role="button"
                    tabindex="0"
                    aria-label="${getText("synopsisAria")}"
                >
                    ${synopsisText}
                </p>

                <span class="synopsis-hint">
                    ${getText("synopsisHint")}
                </span>

                <div class="detail-actions">

                    <a
                        class="detail-action detail-primary-action ${chapters.length === 0 ? "disabled" : ""}"
                        href="${continueChapterLink}"
                        ${chapters.length === 0 ? 'aria-disabled="true"' : ""}
                    >
                        ${continueButtonText}
                    </a>

                    <button
                        type="button"
                        class="detail-action detail-favorite-action"
                        id="detail-favorite"
                        aria-pressed="false"
                    >
                        ${getText("favorite")}
                    </button>

                </div>

            </section>

            <section class="detail-section">

                <h2>${getText("chapters")}</h2>

                <div class="chapter-list">
                    ${chaptersHTML}
                </div>

            </section>

        </div>

        <div
            class="synopsis-modal"
            id="synopsis-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="synopsis-modal-title"
        >

            <div class="synopsis-modal-content">

                <div class="synopsis-modal-header">

                    <h2 id="synopsis-modal-title">
                        ${getText("synopsisTitle")}
                    </h2>

                    <button
                        type="button"
                        class="synopsis-close"
                        id="synopsis-close"
                        aria-label="${getText("close")}"
                    >
                        ×
                    </button>

                </div>

                <p class="synopsis-full-text">
                    ${synopsisText}
                </p>

                <div class="synopsis-modal-footer">
                    ${getText("synopsisFooter")}
                </div>

            </div>

        </div>

    `;

    /* =================================
       SYNOPSIS EVENTS
    ================================= */

    const synopsisButton = document.getElementById("detail-synopsis");
    const synopsisModal = document.getElementById("synopsis-modal");
    const synopsisClose = document.getElementById("synopsis-close");

    synopsisButton?.addEventListener("click", openSynopsis);

    synopsisButton?.addEventListener("keydown", event => {

        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openSynopsis();
        }

    });

    synopsisClose?.addEventListener("click", closeSynopsis);

    synopsisModal?.addEventListener("click", event => {

        if (event.target === synopsisModal) {
            closeSynopsis();
        }

    });

    /* =================================
       FAVORITE EVENT
    ================================= */

    updateFavoriteButton();

    document
        .getElementById("detail-favorite")
        ?.addEventListener("click", toggleDetailFavorite);

    /* =================================
       SCROLL REVEAL
    ================================= */

    const revealSections = document.querySelectorAll(
        ".detail-section"
    );

    if ("IntersectionObserver" in window) {

        const revealObserver = new IntersectionObserver(
            entries => {

                entries.forEach(entry => {

                    if (entry.isIntersecting) {

                        entry.target.classList.add("reveal-visible");

                        revealObserver.unobserve(entry.target);
                    }

                });

            },
            {
                threshold: 0.05
            }
        );

        revealSections.forEach(section => {
            revealObserver.observe(section);
        });

    } else {

        revealSections.forEach(section => {
            section.classList.add("reveal-visible");
        });

    }

}

/* =================================
   EVENTS
================================= */

document.addEventListener("keydown", event => {

    const modal = document.getElementById("synopsis-modal");

    if (
        event.key === "Escape" &&
        modal?.classList.contains("open")
    ) {
        closeSynopsis();
    }

});

detailContent.addEventListener("click", event => {

    const link = event.target.closest(
        ".chapter-item, .detail-primary-action"
    );

    if (!link) return;

    if (link.classList.contains("disabled")) {
        event.preventDefault();
        return;
    }

    if (
        !link.href ||
        link.getAttribute("href") === "#"
    ) {
        return;
    }

    event.preventDefault();

    navigateWithFade(link.href);

});

/* =================================
   BACK TO HOME
================================= */

document
    .getElementById("back-home")
    .addEventListener("click", event => {

        event.preventDefault();

        navigateWithFade("index.html");

    });

/* =================================
   LANGUAGE CHANGE
================================= */

function applyDetailLanguage(language) {

    if (!supportedLanguages.includes(language)) {
        return;
    }

    currentLanguage = language;

    document.documentElement.lang = language;

    document.getElementById("back-home").textContent =
        getText("back");

    renderDetail();

}

window.addEventListener("yume-language-change", event => {

    applyDetailLanguage(event.detail.language);

});

/* =================================
   INITIALIZE
================================= */

document.documentElement.lang = currentLanguage;

document.getElementById("back-home").textContent =
    getText("back");

renderDetail();

window.addEventListener("pageshow", () => {

    requestAnimationFrame(() => {

        document.body.classList.add("page-ready");

        document.body.classList.remove("page-leaving");

    });

});

</script>
